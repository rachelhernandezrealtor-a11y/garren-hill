function useScrollY() {
  const [y, setY] = React.useState(0);
  React.useEffect(() => {
    const h = () => setY(window.scrollY);
    window.addEventListener('scroll', h, { passive: true });
    return () => window.removeEventListener('scroll', h);
  }, []);
  return y;
}

function useInView(ref, threshold = 0.1) {
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) setVisible(true); },
      { threshold }
    );
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return visible;
}

function FadeIn({ children, delay = 0, style = {} }) {
  const ref = React.useRef();
  const visible = useInView(ref);
  return (
    <div ref={ref} style={{
      opacity: visible ? 1 : 0,
      transform: visible ? 'translateY(0)' : 'translateY(22px)',
      transition: `opacity 0.9s ease ${delay}s, transform 0.9s ease ${delay}s`,
      ...style,
    }}>
      {children}
    </div>
  );
}

function CinematicReveal({ eyebrowText, headline, body, imgSrc, reverse = false, position = 'center' }) {
  const ref = React.useRef();
  const scrollY = useScrollY();
  const [sectionTop, setSectionTop] = React.useState(0);
  React.useEffect(() => {
    const update = () => {
      if (ref.current) setSectionTop(ref.current.getBoundingClientRect().top + window.scrollY);
    };
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, []);
  const parallax = Math.max(-50, Math.min(50, (scrollY - sectionTop) * 0.22));

  return (
    <div ref={ref} style={{ position: 'relative', minHeight: '88vh', overflow: 'hidden', display: 'flex', alignItems: 'center' }}>
      <div style={{
        position: 'absolute', inset: 0,
        backgroundImage: `url(${imgSrc})`,
        backgroundSize: 'cover',
        backgroundPosition: `${position} calc(50% + ${parallax}px)`,
        transform: 'scale(1.06)',
        zIndex: 0,
      }} />
      <div style={{
        position: 'absolute', inset: 0, zIndex: 1,
        background: reverse
          ? 'linear-gradient(to left, rgba(10,10,10,0.92) 38%, rgba(10,10,10,0.1) 100%)'
          : 'linear-gradient(to right, rgba(10,10,10,0.92) 38%, rgba(10,10,10,0.1) 100%)',
      }} />
      <div style={{
        position: 'relative', zIndex: 2,
        width: 'min(52%, 560px)',
        padding: 'clamp(4rem, 8vw, 7rem) clamp(2.5rem, 5vw, 5rem)',
        marginLeft: reverse ? 'auto' : 0,

        </FadeIn>
      </div>
    </div>
  );
}

}

        body="The original frontispiece in the dining room was not touched during the 1999 restoration. It has been here since 1916 and required nothing. The room itself was designed for the kind of dinner that begins with cocktails on the terrace and ends when the last candle goes out. Twenty-five years of gatherings -- the English Speaking Union, Phi Beta Kappa, the DAR, wedding celebrations -- have only confirmed what the builder already knew."
        imgSrc={IMG_DINING}
      />

      {/* RESTORATION SECTION */}
      <div style={{ padding: 'clamp(5rem, 10vw, 9rem) clamp(2rem, 10vw, 14rem)', maxWidth: 840, margin: '0 auto' }}>
        <FadeIn>
          <span style={eyebrow}>The Restoration</span>
          <h2 style={{
            fontFamily: 'Georgia, serif', fontWeight: 400,
            fontSize: 'clamp(1.9rem, 3vw, 3rem)',
            color: '#fff', lineHeight: 1.15, margin: '0 0 2rem',
          }}>
            Three years.<br /><em>Everything replaced.</em><br />Everything that mattered, kept.
          </h2>
          <div style={{ width: 36, height: 1, background: GOLD, opacity: 0.4, margin: '0 0 2.5rem' }} />
        </FadeIn>
        <FadeIn delay={0.15}>
          <p style={{ color: CREAM, fontSize: '1.05rem', lineHeight: 2.1, opacity: 0.85, margin: '0 0 2rem' }}>
            In 1998, Durham architect Thomas O'Shea recreated the original drawings from scratch -- there were none left. General contractor Dennis Dunagan led a three-year rebuild: interior completely gutted, all plumbing and electrical replaced, new joists, every Marvin window custom-ordered to match the original Georgian profiles. A kitchen was built from nothing. New heart-pine flooring was laid where there had been none.
          </p>
          <p style={{ color: CREAM, fontSize: '1.05rem', lineHeight: 2.1, opacity: 0.85 }}>
            What was left alone is the case for the house: the 1916 leaded glass sidelights and over-door fanlight at the front entry. The original frontispiece in the dining room. Seven carved fireplace mantels. The wide-plank oak floors. Every solid-wood interior door, still fitted with its original brass key plate -- and its original key. These things only reveal themselves to someone paying attention.
          </p>
        </FadeIn>
      </div>

      {/* STAIRCASE FULL BLEED */}
      <FullBleed imgSrc={IMG_STAIRCASE} label="The Staircase -- Narrow. Dramatic. Original." height="60vw" maxH="720px" />

      {/* KITCHEN CINEMATIC */}
      <CinematicReveal
        eyebrowText="The Kitchen"
        headline="Built from nothing.<br /><em>Feels like it was</em><br />always here."
        body="There was no kitchen in the original 1916 house. One was built entirely from scratch during the restoration -- opened to the rear grounds, to the grandiflora magnolias, to the three sycamores Betty Dumaine planted in 1959. New heart-pine flooring continues the material thread from the rest of the house. The result is a room that does not announce its modernity. It simply works."
        imgSrc={IMG_KITCHEN}
        reverse={true}
      />

      {/* POWDER ROOM CINEMATIC */}
      <CinematicReveal
        eyebrowText="The Details"
        headline="Tennessee marble.<br /><em>Polished brass.</em><br />1916 hardware."
        body="A Tennessee marble vanity. The original polished brass hinges and doorknobs still on every door in the house -- and the original key fits every lock. Small rooms tell the truth about a house. A powder room that stops guests mid-sentence, not because it announces itself, but because every material in it is exactly right and nothing is trying too hard."
        imgSrc={IMG_POWDER}
      />

      {/* GROUNDS CINEMATIC */}
      <CinematicReveal
        eyebrowText="The Grounds"
        headline="4.15 acres.<br /><em>Pool. Tennis.</em><br />The Wee Cottage."
        body="Betty Dumaine planted three American sycamores in 1959. They are still here. So is the camellia garden, the grandiflora magnolias, the dogwoods, the long-leaf pines, the iris beds. The brick terrace behind the house seats a large group for dinner without crowding anyone. A 20-by-40 pool. Two tennis courts. And in the far corner of the grounds: the Wee Cottage, a fully furnished guest retreat transported here by sky crane and set on its own foundation. No one who hears that story forgets it."
        imgSrc={IMG_REAR}
        reverse={true}
        position="center"
      />

      {/* BLUE FOX MOMENT */}
      <BlueFoxMoment />

      {/* POOL FULL BLEED */}
      <FullBleed imgSrc={IMG_POOL} label="The Pool -- 20 x 40 ft. In-ground well serves irrigation and pool." height="58vw" maxH="700px" />

      {/* CENTURY TIMELINE */}
      <div style={{ padding: 'clamp(5rem, 10vw, 9rem) clamp(2rem, 8vw, 10rem)', background: '#060606' }}>
        <div style={{ maxWidth: 780, margin: '0 auto' }}>
          <FadeIn>
            <span style={{ ...eyebrow, textAlign: 'center', display: 'block', marginBottom: '3.5rem' }}>A Century of Stewards</span>
          </FadeIn>
          <TimelineItem
            year="1916"
            title="Walter Hines Page"
            body="Co-founder of Doubleday, Page & Co. He helped nominate Woodrow Wilson for the presidency. Wilson appointed him U.S. Ambassador to the Court of St. James in 1913 -- and Page spent four years in London arguing for American entry into the war, often against Wilson's own instincts. He returned to Moore County in 1918 with hypertension and renal failure and died within weeks. He never saw the house. His son Ralph moved the family in and the home stayed in the Page family through the Second World War."
          />
          <TimelineItem
            year="1918"
            title="The Page Family"
            body="Walter's son Ralph moved the family in. The house stayed in the Page family through a second world war -- a quiet constant while everything else changed."
          />
          <TimelineItem
            year="1959"
            title="Betty Dumaine"
            body="Proper Bostonian, serious foxhunter. She renamed the property Hollycrest for the native holly trees on the grounds. Her Vassar roommate had become the Queen of Thailand -- the royal entourage visited more than once. She kept horses, hounds, and peacocks. She threw annual birthday parties for the horses and invited children from the surrounding community. Betty Dumaine did nothing by halves."
          />
          <TimelineItem
            year="1980"
            title="Duke University"
            body="Betty left the estate to Duke University on her death in 1980. Duke advertised in Atlanta and New York and found no takers. The tennis courts and pool were added in 1985 in preparation for a subdivision that never happened. The house waited."
          />
          <TimelineItem
            year="1999"
            title="The Restoration"
            body="The current stewards purchased the property and spent three years rebuilding it from the inside out -- every system, every surface, every window. Every room in this house was considered by someone who understood exactly what they had. The Georgian bones were preserved. The rest was done with uncommon care."
          />
          <TimelineItem
            year="Now"
            title="The Next Chapter"
            body="The house is ready."
            last={true}
          />
        </div>
      </div>

      {/* PRIMARY SUITE CINEMATIC */}
      <CinematicReveal
        eyebrowText="The Primary Suite"
        headline="Light from<br /><em>three directions.</em>"
        body="The NE/SW orientation still delivers. The back of the house fills with afternoon light in a way that was clearly planned. A balcony off two of the second-floor bedrooms looks over the tennis courts and rear grounds -- the same prospect the Page family would have had in 1918. A narrow spiral staircase connects the floors with the kind of quiet drama that needs no explaining. Below the main floor: a four-room stone-walled basement, partially finished, climate-controlled. Wine storage. Interior and exterior access."
        imgSrc={IMG_PRIMARY}
        reverse={true}
      />

      {/* PRIMARY BATH FULL BLEED */}
      <FullBleed imgSrc={IMG_BATH} label="The Primary Bath" height="55vw" maxH="660px" />

      {/* FEATURE CARDS */}
      <div style={{ padding: 'clamp(4rem, 8vw, 7rem) clamp(2rem, 6vw, 8rem)', background: DARK }}>
        <div style={{ maxWidth: 1100, margin: '0 auto', display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(255px, 1fr))', gap: '1.5rem' }}>
          {[
            {
              label: 'Recognition',
              title: 'Historic Designation',
              body: 'One of the distinctly historical homes in southern Moore County. Virginia Historic Foundation recognized. 110 years of documented ownership and continuous stewardship.',
            },
            {
              label: 'Infrastructure',
              title: 'County Water, Sewer + Private Well',
              body: '250-gallon underground propane. In-ground well and storage tank serving the pool and full irrigation. All 7 fireplaces with propane gas logs. Every system rebuilt during the 1999 restoration.',
            },
            {
              label: 'Entertaining',
              title: 'Built for Gatherings',
              body: 'Over 25 years as a private venue: English Speaking Union, Pi Beta Phi, Phi Beta Kappa, DAR, the Folio Club of Durham, wedding celebrations. The house knows how to hold a crowd.',
            },
            {
              label: 'Below Grade',
              title: 'Four-Room Stone Basement',
              body: 'Stone-walled basement under half the house. Partially finished, climate-controlled. Wine storage, interior and exterior access. The house has considerably more room than it shows.',
            },
          ].map(card => (
            <FadeIn key={card.title}>
              <div style={{ background: GLASS, border: `1px solid ${GLASS_BORDER}`, padding: '2.5rem 2rem' }}>
                <span style={{ ...eyebrow, marginBottom: '0.9rem' }}>{card.label}</span>
                <p style={{ fontFamily: 'Georgia, serif', fontSize: '1.02rem', color: '#fff', margin: '0 0 0.9rem', lineHeight: 1.3 }}>{card.title}</p>
                <p style={{ color: CREAM, fontSize: '0.9rem', lineHeight: 1.95, opacity: 0.7, margin: 0 }}>{card.body}</p>
              </div>
            </FadeIn>
          ))}
        </div>
      </div>

      {/* FOYER CINEMATIC */}
      <CinematicReveal
        eyebrowText="The Entry"
        headline="The leaded glass<br /><em>has been here</em><br />since 1916."
        body="The leaded glass sidelights flanking the front door. The over-door fanlight above it. Both original to 1916, both untouched. Every interior door in the house still carries its original brass key plate -- and the key fits. These details were preserved not because restoration required it, but because whoever was in charge understood that some things cannot be replicated. They can only be inherited."
        imgSrc={IMG_FOYER}
        reverse={true}
      />

      {/* LOCATION */}
      <div style={{ padding: 'clamp(5rem, 10vw, 9rem) clamp(2rem, 10vw, 14rem)', maxWidth: 840, margin: '0 auto', textAlign: 'center' }}>
        <FadeIn>
          <span style={eyebrow}>The Location</span>
          <h2 style={{
            fontFamily: 'Georgia, serif', fontWeight: 400,
            fontSize: 'clamp(1.8rem, 3vw, 2.8rem)',
            color: '#fff', lineHeight: 1.2, margin: '0 0 2rem',
          }}>
            Pinehurst ETJ.<br /><em>Moore County tax rate.</em><br />All the prestige.
          </h2>
          <div style={divider} />
        </FadeIn>
        <FadeIn delay={0.15}>
          <p style={{ color: CREAM, fontSize: '1.05rem', lineHeight: 2.1, opacity: 0.85, margin: '2.2rem 0' }}>
            200 Hollycrest Drive sits within the Pinehurst ETJ -- the extraterritorial jurisdiction. The mailing address is Pinehurst. The property tax rate is Moore County. That pairing is rare, and for a buyer who knows the area, it is not a small thing.
          </p>
          <p style={{ color: CREAM, fontSize: '1.05rem', lineHeight: 2.1, opacity: 0.85 }}>
            Two miles from the village. The Pinehurst Harness Track within walking distance. The Resort, the courses, the restaurants -- close enough to use daily, far enough that the driveway still feels like an arrival. County water and sewer to the street. A private in-ground well serves the irrigation and pool. This house has been maintained as if someone intended to stay.
          </p>
        </FadeIn>
      </div>

      {/* MATTERPORT */}
      <div style={{ background: '#060606', padding: 'clamp(3rem, 6vw, 5rem) clamp(2rem, 6vw, 8rem)' }}>
        <FadeIn>
          <span style={{ ...eyebrow, textAlign: 'center', display: 'block', marginBottom: '2rem' }}>Tour the Estate</span>
          <div style={{
            position: 'relative', paddingBottom: '56.25%', height: 0, overflow: 'hidden',
            border: '1px solid rgba(255,255,255,0.07)',
          }}>
            <iframe
              src="https://my.matterport.com/show/?m=mfwyqT5Btwx&brand=0&mls=1&"
              style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', border: 0 }}
              allowFullScreen
              allow="xr-spatial-tracking"
              title="Garren Hill Virtual Tour"
            />
          </div>
        </FadeIn>
      </div>

      {/* GARDEN FULL BLEED */}
      <FullBleed
        imgSrc={IMG_GARDEN}
        label="The Grounds -- Long-leaf pines. Camellias. Sycamores planted in 1959."
        height="50vw" maxH="600px"
      />

      {/* CLOSING QUOTE */}
      <PullQuote
        quote="This house needs three or four kids running around."
        attribution="The current steward -- after 25 years of preservation"
      />

      {/* CLOSING CTA */}
      <div style={{ padding: 'clamp(6rem, 12vw, 10rem) clamp(2rem, 10vw, 14rem)', textAlign: 'center', background: DARK }}>
        <FadeIn>
          <span style={{ ...eyebrow, textAlign: 'center', display: 'block', marginBottom: '2.5rem' }}>200 Hollycrest Drive -- Pinehurst, NC</span>
          <h2 style={{
            fontFamily: 'Georgia, serif', fontStyle: 'italic', fontWeight: 400,
            fontSize: 'clamp(2.8rem, 6vw, 6rem)',
            color: '#fff', margin: '0 0 2.5rem', lineHeight: 1.06,
          }}>
            Garren Hill is ready.
          </h2>
          <div style={divider} />
          <p style={{ color: 'rgba(255,255,255,0.36)', fontFamily: 'sans-serif', fontSize: '10px', letterSpacing: '0.28em', textTransform: 'uppercase', margin: '2.5rem 0 3rem' }}>
            $4,250,000 -- Listed by Rachel Hernandez
          </p>
          <button onClick={() => setInquiryOpen(true)} style={{
            padding: '1.1rem 3.4rem',
            background: 'rgba(201,169,110,0.15)',
            border: `1px solid ${GOLD}`,
            boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.08)',
            color: GOLD, fontFamily: 'sans-serif', fontSize: '10px',
            letterSpacing: '0.32em', textTransform: 'uppercase',
            cursor: 'pointer', borderRadius: 1,
          }}>
            Begin a Conversation
          </button>
        </FadeIn>
      </div>

      {/* FOOTER */}
      <div style={{
        borderTop: '1px solid rgba(255,255,255,0.05)',
        padding: '1.8rem 4vw',
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        background: '#050505',
        flexWrap: 'wrap', gap: '1rem',
      }}>
        <span style={{ fontFamily: 'Georgia, serif', fontStyle: 'italic', fontSize: '0.88rem', color: 'rgba(255,255,255,0.22)' }}>Garren Hill</span>
        <span style={{ fontFamily: 'sans-serif', fontSize: '9px', letterSpacing: '0.2em', textTransform: 'uppercase', color: 'rgba(255,255,255,0.16)' }}>Rachel Hernandez -- Listing Agent</span>
      </div>

      {/* INQUIRY MODAL */}
      {inquiryOpen && (
        <div onClick={() => setInquiryOpen(false)} style={{
          position: 'fixed', inset: 0, zIndex: 500,
          background: 'rgba(0,0,0,0.9)', backdropFilter: 'blur(12px)',
          display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '2rem',
        }}>
          <div onClick={(e) => e.stopPropagation()} style={{
            position: 'relative',
            background: '#0f0f0f', border: '1px solid rgba(255,255,255,0.09)',
            maxWidth: 480, width: '100%', padding: 'clamp(2rem, 5vw, 3.5rem)',
          }}>
            {submitted ? (
              <div style={{ textAlign: 'center', padding: '2rem 0' }}>
                <p style={{ fontFamily: 'Georgia, serif', fontStyle: 'italic', fontSize: '1.5rem', color: '#fff', margin: '0 0 1rem' }}>Thank you.</p>
                <p style={{ color: 'rgba(255,255,255,0.42)', fontSize: '0.95rem', margin: 0, lineHeight: 1.7 }}>We will be in touch shortly.</p>
              </div>
            ) : (
              <>
                <span style={{ ...eyebrow, marginBottom: '0.4rem' }}>Inquire</span>
                <h3 style={{ fontFamily: 'Georgia, serif', fontWeight: 400, fontSize: '1.5rem', color: '#fff', margin: '0 0 2rem' }}>Garren Hill</h3>
                <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                  {[
                    { key: 'name', placeholder: 'Full Name', type: 'text', required: true },
                    { key: 'email', placeholder: 'Email Address', type: 'email', required: true },
                    { key: 'phone', placeholder: 'Phone (optional)', type: 'tel', required: false },
                  ].map(f => (
                    <input key={f.key} type={f.type} placeholder={f.placeholder} required={f.required}
                      value={form[f.key]} onChange={(e) => setForm({ ...form, [f.key]: e.target.value })}
                      style={{
                        background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.09)',
                        color: '#fff', padding: '0.85rem 1rem',
                        fontFamily: 'Georgia, serif', fontSize: '0.95rem',
                        outline: 'none', borderRadius: 1, width: '100%',
                      }}
                    />
                  ))}
                  <textarea placeholder="Message (optional)" rows={4}
                    value={form.message} onChange={(e) => setForm({ ...form, message: e.target.value })}
                    style={{
                      background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.09)',
                      color: '#fff', padding: '0.85rem 1rem',
                      fontFamily: 'Georgia, serif', fontSize: '0.95rem',
                      outline: 'none', resize: 'vertical', borderRadius: 1, width: '100%',
                    }}
                  />
                  <button type="submit" style={{
                    padding: '1rem', background: GOLD, border: 'none',
                    color: '#0a0a0a', fontFamily: 'sans-serif', fontSize: '10px',
                    letterSpacing: '0.28em', textTransform: 'uppercase',
                    cursor: 'pointer', marginTop: '0.5rem', borderRadius: 1,
                  }}>
                    Send Inquiry
                  </button>
                </form>
              </>
            )}
            <button onClick={() => setInquiryOpen(false)} style={{
              position: 'absolute', top: '1.2rem', right: '1.2rem',
              background: 'none', border: 'none', color: 'rgba(255,255,255,0.3)',
              fontSize: '1.2rem', cursor: 'pointer', lineHeight: 1,
            }}>x</button>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
