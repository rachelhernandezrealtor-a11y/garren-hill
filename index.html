<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garran Hill · 200 Hollycrest Drive · Pinehurst, NC · $4,250,000</title>
<meta name="description" content="Garran Hill. Neo-Georgian estate. Walter Hines Page. Built 1916. 6,072 SF. 4.15 acres. Pinehurst, North Carolina. Offered at $4,250,000 by Sotheby's International Realty.">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════════════════
     GARRAN HILL — LOCKED DESIGN SYSTEM v2
     3 fonts. 5 sizes. Uniform rhythm. One designer.
     6rem vertical padding desktop / 3rem mobile — everywhere.
     Text blocks: max-width 42rem, centered.
     Images: full-width on mobile, no radius, no shadow, no glow.
  ═══════════════════════════════════════════════════════ */

  :root {
    --dark: #0a0a0a;
    --gold: #C9A96E;
    --cream: #F5F0E8;
    --cream-dim: rgba(245,240,232,0.72);
    --cream-faint: rgba(245,240,232,0.45);
    --stone: rgba(245,240,232,0.35);

    /* TYPE SCALE — LOCKED */
    --fs-hero:     clamp(5rem, 16vw, 14rem);
    --fs-title:    clamp(2rem, 4.5vw, 3.4rem);
    --fs-subtitle: clamp(1.3rem, 2.5vw, 1.9rem);
    --fs-body:     clamp(1rem, 1.5vw, 1.15rem);
    --fs-eyebrow:  clamp(0.6rem, 0.85vw, 0.68rem);

    /* RHYTHM — LOCKED */
    --section-pad-v: 6rem;
    --section-pad-h: clamp(2rem, 10vw, 12rem);
    --text-max: 42rem;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300;
    font-size: var(--fs-body);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  /* ── TYPOGRAPHY ── */
  .gh-title {
    font-family: 'Pinyon Script', cursive;
    font-size: var(--fs-hero);
    font-weight: 400;
    line-height: 0.9;
    color: var(--cream);
  }

  h2, .section-headline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: var(--fs-title);
    font-weight: 300;
    line-height: 1.15;
    color: var(--cream);
    letter-spacing: 0.01em;
    max-width: var(--text-max);
  }

  h2 em, .section-headline em {
    font-style: italic;
    font-weight: 300;
  }

  h3, .gh-subtitle {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: var(--fs-subtitle);
    font-weight: 300;
    font-style: italic;
    line-height: 1.35;
    color: var(--cream-dim);
    max-width: var(--text-max);
  }

  p, .body-text {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: var(--fs-body);
    font-weight: 300;
    line-height: 1.75;
    color: var(--cream-dim);
    max-width: var(--text-max);
  }

  .eyebrow, .label, .micro {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-size: var(--fs-eyebrow);
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    line-height: 1.3;
  }

  .stat-number {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(1.6rem, 3vw, 2.4rem);
    font-weight: 300;
    color: var(--gold);
    line-height: 1;
  }

  .stat-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-size: var(--fs-eyebrow);
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--cream-dim);
    margin-top: 0.4rem;
  }

  blockquote, .quote {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: var(--fs-subtitle);
    font-weight: 300;
    font-style: italic;
    color: var(--cream-dim);
    line-height: 1.6;
    border-left: 1px solid var(--gold);
    padding-left: 2rem;
    margin: 2.5rem 0;
    max-width: var(--text-max);
  }

  .caption, figcaption {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(0.52rem, 0.72vw, 0.6rem);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--stone);
    margin-top: 0.75rem;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9000;
    display: flex; align-items: center; justify-content: space-between;
    padding: clamp(1rem, 2vw, 1.5rem) clamp(1.5rem, 5vw, 5rem);
    background: transparent;
    transition: background 0.4s ease;
  }
  nav.scrolled { background: rgba(10,10,10,0.95); backdrop-filter: blur(8px); }

  .nav-logo {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(0.85rem, 1.2vw, 1rem);
    font-weight: 300;
    letter-spacing: 0.1em;
    color: var(--cream);
    text-decoration: none;
    display: flex; align-items: center; gap: 0.75rem;
  }
  .nav-logo img { height: 32px; width: auto; opacity: 0.9; }

  .nav-links {
    display: flex; gap: clamp(1.5rem, 3vw, 3rem); list-style: none;
  }
  .nav-links a {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.6rem;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--cream-dim);
    text-decoration: none;
    transition: color 0.25s;
  }
  .nav-links a:hover { color: var(--gold); }

  /* ── SECTIONS — UNIFORM RHYTHM ── */
  section {
    position: relative;
    padding: var(--section-pad-v) var(--section-pad-h);
  }

  /* Cinematic fade between sections */
  section::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 100px;
    background: linear-gradient(to bottom, transparent, var(--dark));
    pointer-events: none;
    z-index: 2;
  }

  /* Text block container — centered, max 42rem */
  .text-block {
    max-width: var(--text-max);
    margin: 0 auto;
  }

  .text-section {
    max-width: var(--text-max);
    margin: 0 auto;
  }

  /* Stack spacing within sections */
  .section-headline + p,
  .section-headline + .body-text,
  h2 + p,
  h2 + .body-text { margin-top: 1.5rem; }

  .eyebrow + .section-headline,
  .eyebrow + h2 { margin-top: 1rem; }

  p + p,
  .body-text + .body-text { margin-top: 1rem; }

  .gold-rule {
    width: 4rem; height: 1px;
    background: linear-gradient(to right, var(--gold), transparent);
    margin: 2rem 0;
  }

  /* ── IMAGES — NO RADIUS, NO SHADOW, NO GLOW ── */
  img {
    max-width: 100%;
    display: block;
    border-radius: 0;
    box-shadow: none;
  }

  .img-full {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    border-radius: 0;
    box-shadow: none;
  }

  /* Photo frame — full bleed, no padding */
  .photo-frame {
    width: 100%;
    overflow: hidden;
    border-radius: 0;
    box-shadow: none;
    line-height: 0;
  }

  .photo-frame img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 0;
    box-shadow: none;
  }

  /* Tall cinematic image */
  .photo-cinematic {
    width: 100%;
    height: clamp(55vh, 70vh, 85vh);
    object-fit: cover;
    border-radius: 0;
    box-shadow: none;
    display: block;
  }

  /* ── STAT BAR ── */
  .stat-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 2.5vw, 28px) clamp(20px, 4vw, 60px);
    background: rgba(10,10,10,0.72);
    backdrop-filter: blur(6px);
    border-top: 1px solid rgba(201,169,110,0.18);
    gap: clamp(8px, 2vw, 32px);
  }

  .stat-item {
    display: flex; flex-direction: column; align-items: center;
    padding: 0 clamp(1.5rem, 3vw, 3.5rem);
    text-align: center;
  }

  .stat-divider {
    width: 1px;
    height: 2.5rem;
    background: rgba(201,169,110,0.35);
    flex-shrink: 0;
  }


  /* ── HERO ── */
  .hero {
    position: relative;
    height: 100svh; min-height: 640px;
    display: flex; align-items: flex-end;
    position: relative; overflow: hidden;
    padding: 0;
  }

  .hero::after { display: none; }

  .hero-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
  }

  .hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(10,10,10,0.5) 0%,
      rgba(10,10,10,0.1) 25%,
      rgba(10,10,10,0.0) 40%,
      rgba(10,10,10,0.5) 65%,
      rgba(10,10,10,0.92) 100%
    );
    z-index: 1;
  }

  .hero-content {
    position: relative; z-index: 2;
    padding: 0 clamp(2rem, 8vw, 9rem) clamp(3rem, 8vh, 7rem);
  }

  .hero-eyebrow {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-size: var(--fs-eyebrow);
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.75rem;
  }

  .hero-sub {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(0.6rem, 0.9vw, 0.72rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cream-dim);
    margin-top: 1rem;
  }

  .hero-border {
    position: absolute; inset: 14px;
    border: 1px solid rgba(201,169,110,0.4);
    pointer-events: none; z-index: 3;
  }

  /* ── BUTTONS ── */
  .btn-ghost {
    display: inline-block;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid rgba(201,169,110,0.5);
    padding: 0.9rem 2.2rem;
    text-decoration: none;
    transition: background 0.3s, color 0.3s;
    border-radius: 0;
  }
  .btn-ghost:hover { background: var(--gold); color: var(--dark); }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    :root {
      --section-pad-v: 3rem;
      --section-pad-h: 0rem;
    }

    /* On mobile: sections have no horizontal padding — full bleed */
    section {
      padding: 3rem 0;
    }

    /* Text blocks get their own padding on mobile */
    .text-block,
    .text-section,
    p, .body-text,
    h2, .section-headline,
    h3, .eyebrow, .gold-rule, blockquote {
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }

    /* Images go full-width, no side padding */
    .photo-frame,
    .photo-cinematic,
    .img-full {
      width: 100%;
      padding: 0;
      margin-left: 0;
      margin-right: 0;
    }

    .nav-links { display: none; }
    .stat-bar { gap: 0.5rem; }
    .stat-item { padding: 0.5rem 1rem; }
    .stat-divider { display: none; }
    .hero-content { padding: 0 1.5rem 3rem; }

    /* Remove section-level fade — too heavy on mobile */
    section::after { display: none; }
  }

  @media (max-width: 375px) {
    :root { --section-pad-v: 2.5rem; }
    section { padding: 2.5rem 0; }
  }



  /* STAT CREST */
  .stat-crest-col {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 clamp(12px, 2vw, 28px);
    position: relative;
    z-index: 2;
  }
  .stat-crest-img {
    width: clamp(80px, 9vw, 120px);
    height: auto;
    display: block;
    background: transparent;
    filter: drop-shadow(0 0 10px rgba(201,169,110,0.45));
    margin-top: -1.8rem;
    margin-bottom: -1.8rem;
  }

</style>
</head>
