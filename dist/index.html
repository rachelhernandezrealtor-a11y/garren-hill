function useW() {
  const [w, setW] = useState(typeof window !== 'undefined' ? window.innerWidth : 1200);
  useEffect(() => {
    const fn = () => setW(window.innerWidth);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, []);
  return w;
}
function useInView(ref, threshold = 0.15) {
  const [v, setV] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) setV(true); }, { threshold });
    o.observe(ref.current);
    return () => o.disconnect();
  }, []);
  return v;
}

function useParallax(strength = 0.2) {
  const ref = useRef();
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const h = () => {
      const rect = el.getBoundingClientRect();
      const mid = rect.top + rect.height / 2 - window.innerHeight / 2;
      el.style.transform = `translateY(${mid * strength}px)`;
    };
    window.addEventListener('scroll', h, { passive: true });
    h();
    return () => window.removeEventListener('scroll', h);
  }, [strength]);
  return ref;
}

function Fade({ children, delay = 0, up = true }) {
  const ref = useRef();
  const v   = useInView(ref);
  return (
    <div ref={ref} style={{
      opacity:   v ? 1 : 0,
      transform: v ? 'none' : up ? 'translateY(32px)' : 'none',
      transition: `opacity 1.4s cubic-bezier(.22,1,.36,1) ${delay}s, transform 1.4s cubic-bezier(.22,1,.36,1) ${delay}s`,
    }}>
      {children}
    </div>
  );
}

/* StaggerGallery -- photos stagger in as cards landing on a table */
function StaggerGallery({ photos, onOpen }) {
  if (!photos || !photos.length) return null;
  const ref   = useRef();
  const v     = useInView(ref, 0.08);
  const total = photos.length;

  /* layout: first photo is tall hero, rest are 2-col grid */

  const rest   = photos.slice(1);

  return (
    <div ref={ref} style={{ marginTop: '2.4rem' }}>
      <p style={{ fontFamily: 'sans-serif', fontSize: '7px', letterSpacing: '0.38em', textTransform: 'uppercase', color: GOLD, opacity: 0.45, margin: '0 0 1rem' }}>
        {total} {total === 1 ? 'image' : 'images'}
      </p>

      {/* Hero tile */}
      <div
        onClick={() => onOpen(photos, 0)}
        style={{
          width: '100%', aspectRatio: '16/9', position: 'relative', overflow: 'hidden', cursor: 'zoom-in', marginBottom: 4,
          opacity: v ? 1 : 0, transform: v ? 'none' : 'translateY(40px) scale(0.97)',
          transition: 'opacity 1.1s cubic-bezier(.22,1,.36,1) 0s, transform 1.1s cubic-bezier(.22,1,.36,1) 0s',
        }}
      >
        <div style={{ position: 'absolute', inset: 0, backgroundImage: `url(${hero.src})`, backgroundSize: 'cover', backgroundPosition: 'center', transition: 'transform 0.6s ease' }}
          onMouseEnter={e => e.currentTarget.style.transform = 'scale(1.03)'}
          onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
        />
        {total > 1 && (
          <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0)', transition: 'background .3s' }}
            onMouseEnter={e => e.currentTarget.style.background = 'rgba(0,0,0,0.12)'}
            onMouseLeave={e => e.currentTarget.style.background = 'rgba(0,0,0,0)'}
          />
        )}
        {hero.caption && (
          <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, padding: '2rem 1.2rem 1rem', background: 'linear-gradient(transparent, rgba(0,0,0,0.75))' }}>
            <p style={{ fontFamily: SERIF, fontStyle: 'italic', color: 'rgba(255,255,255,0.7)', fontSize: '0.8rem', margin: 0 }}>{hero.caption}</p>
          </div>
        )}
      </div>

      {/* Rest grid */}
      {rest.length > 0 && (
        <div style={{ display: 'grid', gridTemplateColumns: rest.length === 1 ? '1fr' : '1fr 1fr', gap: 4 }}>
          {rest.map((p, i) => {
            const delay = 0.12 + i * 0.1;
            const isLast = i === rest.length - 1;
            const hiddenCount = total - 4;
            const showOverlay = isLast && hiddenCount > 0 && i >= 2;
            return (
              <div key={i}
                onClick={() => onOpen(photos, i + 1)}
                style={{
                  position: 'relative', aspectRatio: '4/3', overflow: 'hidden', cursor: 'zoom-in',
                  opacity: v ? 1 : 0, transform: v ? 'none' : `translateY(50px) scale(0.95)`,
                  transition: `opacity 1s cubic-bezier(.22,1,.36,1) ${delay}s, transform 1s cubic-bezier(.22,1,.36,1) ${delay}s`,
                }}
              >
                <div style={{ position: 'absolute', inset: 0, backgroundImage: `url(${p.src})`, backgroundSize: 'cover', backgroundPosition: 'center', transition: 'transform 0.5s ease' }}
                  onMouseEnter={e => e.currentTarget.style.transform = 'scale(1.04)'}
                  onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
                />
                {showOverlay ? (
                  <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.62)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <span style={{ fontFamily: SERIF, fontStyle: 'italic', color: '#fff', fontSize: '1.1rem', letterSpacing: '0.02em' }}>+{hiddenCount + 1} more</span>
                  </div>
                ) : (
                  <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0)', transition: 'background .28s' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(0,0,0,0.18)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'rgba(0,0,0,0)'}
                  />
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   LIGHTBOX -- premium slide + thumbnail strip
============================================================ */
function Lightbox({ photos, idx: startIdx, onClose }) {
  const [idx, setIdx]   = useState(startIdx);
  const [dir, setDir]   = useState(0);
  const [anim, setAnim] = useState(false);
  const n = photos.length;

  const go = useCallback((d) => {
    setDir(d); setAnim(true);
    setTimeout(() => { setIdx(i => (i + d + n) % n); setDir(0); setAnim(false); }, 260);
  }, [n]);

  const prev = useCallback(() => go(-1), [go]);
  const next = useCallback(() => go(1),  [go]);

  useEffect(() => {
    const h = e => {
      if (e.key === 'Escape')     onClose();
      if (e.key === 'ArrowLeft')  prev();
      if (e.key === 'ArrowRight') next();
    };
    window.addEventListener('keydown', h);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', h); document.body.style.overflow = ''; };
  }, [prev, next, onClose]);

  const tx = useRef(null);
  const onTS = e => { tx.current = e.touches[0].clientX; };
  const onTE = e => {
    if (tx.current === null) return;
    const dx = e.changedTouches[0].clientX - tx.current;
    if (Math.abs(dx) > 44) { dx < 0 ? next() : prev(); }
    tx.current = null;
  };

  const slide = {
    opacity:   anim ? 0 : 1,
    transform: anim ? `translateX(${dir > 0 ? 48 : -48}px)` : 'none',
    transition: anim ? 'none' : 'opacity .35s ease, transform .35s ease',
  };

  const thumbW = Math.min(68, Math.max(44, Math.floor((Math.min(window.innerWidth, 1200) - 120) / Math.max(n, 1))));

  return (
    <div onTouchStart={onTS} onTouchEnd={onTE}
      style={{ position: 'fixed', inset: 0, background: 'rgba(3,3,3,0.97)', zIndex: 9999, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>

      {/* top bar */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 58, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 2rem', borderBottom: '1px solid rgba(255,255,255,0.06)' }}>
        <span style={{ fontFamily: SERIF, fontStyle: 'italic', fontSize: '0.78rem', color: GOLD, opacity: 0.75, letterSpacing: '0.04em' }}>Garran Hill</span>
        <span style={{ fontFamily: 'sans-serif', fontSize: '7.5px', letterSpacing: '0.3em', textTransform: 'uppercase', color: 'rgba(255,255,255,0.3)' }}>{idx + 1} / {n}</span>
        <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,0.38)', fontSize: '1.2rem', cursor: 'pointer', padding: '0.5rem', lineHeight: 1 }}>&#10005;</button>
      </div>

      {/* image */}
      <div onClick={onClose} style={{ flex: 1, width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '4rem 5rem 0', position: 'relative' }}>
        {n > 1 && (
          <button onClick={e => { e.stopPropagation(); prev(); }}
            style={{ position: 'absolute', left: 'clamp(0.4rem,1.5vw,1.5rem)', zIndex: 3, background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', color: 'rgba(255,255,255,0.6)', width: 50, height: 50, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.5rem', cursor: 'pointer', backdropFilter: 'blur(8px)' }}>
            &#8249;
          </button>
        )}
        <div onClick={e => e.stopPropagation()} style={{ ...slide, display: 'flex', flexDirection: 'column', alignItems: 'center', maxWidth: '88vw' }}>
          <img key={idx} src={photos[idx].src} alt={photos[idx].caption || ''}
            style={{ maxWidth: '88vw', maxHeight: '66vh', objectFit: 'contain', display: 'block' }} />
          {photos[idx].caption && (
            <p style={{ fontFamily: SERIF, fontStyle: 'italic', color: 'rgba(255,255,255,0.35)', fontSize: 'clamp(0.72rem,1vw,0.85rem)', marginTop: '1.1rem', textAlign: 'center', maxWidth: 580, letterSpacing: '0.04em' }}>
              {photos[idx].caption}
            </p>
          )}
        </div>
        {n > 1 && (
          <button onClick={e => { e.stopPropagation(); next(); }}
            style={{ position: 'absolute', right: 'clamp(0.4rem,1.5vw,1.5rem)', zIndex: 3, background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', color: 'rgba(255,255,255,0.6)', width: 50, height: 50, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.5rem', cursor: 'pointer', backdropFilter: 'blur(8px)' }}>
            &#8250;
          </button>
        )}
      </div>

      {/* thumbnail strip */}
      {n > 1 && (
        <div style={{ width: '100%', padding: '1.2rem 2rem 1.6rem', display: 'flex', justifyContent: 'center', gap: 5, overflowX: 'auto', flexShrink: 0 }}>
          {photos.map((p, i) => (
            <div key={i} onClick={() => setIdx(i)}
              style={{ flexShrink: 0, width: thumbW, height: thumbW * 0.67, backgroundImage: `url(${p.src})`, backgroundSize: 'cover', backgroundPosition: 'center', cursor: 'pointer', outline: i === idx ? `2px solid ${GOLD}` : '2px solid transparent', opacity: i === idx ? 1 : 0.35, transition: 'opacity .2s, outline .2s' }} />
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   FILM STRIP -- horizontal cinematic scroll with stagger entrance
============================================================ */
function FilmStrip({ photos, onOpen, tall = false }) {
  const scrollRef = useRef(null);
  const wrapRef   = useRef(null);
  const [canLeft,  setCanLeft]  = useState(false);
  const [canRight, setCanRight] = useState(true);
  const v = useInView(wrapRef, 0.1);

  const checkScroll = () => {
    const el = scrollRef.current;
    if (!el) return;
    setCanLeft(el.scrollLeft > 8);
    setCanRight(el.scrollLeft < el.scrollWidth - el.clientWidth - 8);
  };

  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    el.addEventListener('scroll', checkScroll, { passive: true });
    checkScroll();
    return () => el.removeEventListener('scroll', checkScroll);
  }, []);

  const scroll = dir => { scrollRef.current && scrollRef.current.scrollBy({ left: dir * 440, behavior: 'smooth' }); };

  if (!photos || !photos.length) return null;

  const h = tall ? 'clamp(320px,38vw,540px)' : 'clamp(220px,28vw,400px)';

  return (
    <div ref={wrapRef} style={{ position: 'relative', width: '100%' }}>
      {canLeft && (
        <button onClick={() => scroll(-1)} style={{ position: 'absolute', left: 14, top: '50%', transform: 'translateY(-60%)', zIndex: 10, background: 'rgba(8,8,8,0.82)', border: `1px solid rgba(255,255,255,0.14)`, color: 'rgba(255,255,255,0.8)', width: 52, height: 52, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.6rem', cursor: 'pointer' }}>&#8249;</button>
      )}
      {canRight && (
        <button onClick={() => scroll(1)} style={{ position: 'absolute', right: 14, top: '50%', transform: 'translateY(-60%)', zIndex: 10, background: 'rgba(8,8,8,0.82)', border: `1px solid rgba(255,255,255,0.14)`, color: 'rgba(255,255,255,0.8)', width: 52, height: 52, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.6rem', cursor: 'pointer' }}>&#8250;</button>
      )}
      <div ref={scrollRef} style={{ display: 'flex', overflowX: 'auto', scrollSnapType: 'x mandatory', gap: 3, scrollbarWidth: 'none', msOverflowStyle: 'none' }}>
        {photos.map((p, i) => (
          <div key={i} onClick={() => onOpen(photos, i)}
            style={{
              flexShrink: 0, width: 'clamp(260px,36vw,500px)', height: h,
              scrollSnapAlign: 'start', position: 'relative', overflow: 'hidden', cursor: 'zoom-in',
              opacity: v ? 1 : 0,
              transform: v ? 'none' : `translateY(60px) scale(0.93)`,
              transition: `opacity 1s cubic-bezier(.22,1,.36,1) ${i * 0.1}s, transform 1s cubic-bezier(.22,1,.36,1) ${i * 0.1}s`,
            }}>
            <div
              style={{ position: 'absolute', inset: 0, backgroundImage: `url(${p.src})`, backgroundSize: 'cover', backgroundPosition: 'center', transition: 'transform 0.55s ease' }}
              onMouseEnter={e => e.currentTarget.style.transform = 'scale(1.05)'}
              onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
            />
            <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0)', transition: 'background .3s' }}
              onMouseEnter={e => e.currentTarget.style.background = 'rgba(0,0,0,0.16)'}
              onMouseLeave={e => e.currentTarget.style.background = 'rgba(0,0,0,0)'}
            />
            {p.caption && (
              <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, padding: '2rem 1.2rem 1rem', background: 'linear-gradient(transparent, rgba(0,0,0,0.82))' }}>
                <p style={{ fontFamily: SERIF, fontStyle: 'italic', color: 'rgba(255,255,255,0.72)', fontSize: '0.78rem', margin: 0, letterSpacing: '0.04em' }}>{p.caption}</p>
              </div>
            )}
          </div>
        ))}
      </div>
      <div style={{ textAlign: 'center', padding: '0.9rem 0 0' }}>
        <span style={{ fontFamily: 'sans-serif', fontSize: '7px', letterSpacing: '0.34em', textTransform: 'uppercase', color: GOLD, opacity: 0.42 }}>
          {photos.length} images -- scroll to explore
        </span>
      </div>
    </div>
  );
}


/* ============================================================
   MASONRY GALLERY -- Sotheby's editorial grid
============================================================ */
function MasonryGallery({ photos, onOpen }) {
  if (!photos || !photos.length) return null;
  const total  = photos.length;
  const hero   = photos[0];
  const thumbs = photos.slice(1, 4);
  const hidden = total - 4;

  const tile = (p, i, showMore) => (
    <div key={i} onClick={() => onOpen(photos, i)}
      style={{ position: 'relative', backgroundImage: `url(${p.src})`, backgroundSize: 'cover', backgroundPosition: 'center', cursor: 'zoom-in', overflow: 'hidden', minHeight: 80 }}>
      <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0)', transition: 'background .25s' }}
        onMouseEnter={e => e.currentTarget.style.background = 'rgba(0,0,0,0.18)'}
        onMouseLeave={e => e.currentTarget.style.background = 'rgba(0,0,0,0)'} />
      {showMore ? (
        <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.58)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <span style={{ fontFamily: SERIF, fontStyle: 'italic', color: '#fff', fontSize: '1rem', letterSpacing: '0.02em' }}>+{hidden + 1} more</span>
        </div>
      ) : null}
    </div>
  );

  if (total === 1) return (
    <div style={{ marginTop: '2rem', aspectRatio: '16/9', backgroundImage: `url(${hero.src})`, backgroundSize: 'cover', backgroundPosition: 'center', cursor: 'zoom-in' }} onClick={() => onOpen(photos, 0)} />
  );

  return (
    <div style={{ marginTop: '2rem' }}>
      <p style={{ fontFamily: 'sans-serif', fontSize: '7.5px', letterSpacing: '0.32em', textTransform: 'uppercase', color: GOLD, opacity: 0.5, margin: '0 0 0.6rem' }}>
        Gallery -- {total} images
      </p>
      <div style={{ display: 'grid', gridTemplateColumns: '3fr 2fr', gap: 3, alignItems: 'stretch' }}>
        <div onClick={() => onOpen(photos, 0)}
          style={{ position: 'relative', backgroundImage: `url(${hero.src})`, backgroundSize: 'cover', backgroundPosition: 'center', cursor: 'zoom-in', overflow: 'hidden', minHeight: 260 }}>
          <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0)', transition: 'background .25s' }}
            onMouseEnter={e => e.currentTarget.style.background = 'rgba(0,0,0,0.18)'}
            onMouseLeave={e => e.currentTarget.style.background = 'rgba(0,0,0,0)'} />
        </div>
        <div style={{ display: 'grid', gridTemplateRows: `repeat(${thumbs.length}, 1fr)`, gap: 3 }}>
          {thumbs.map((p, i) => tile(p, i + 1, i === thumbs.length - 1 && hidden > 0))}
        </div>
      </div>
    </div>
  );
}

          <GoldLine center />
          <p style={{ fontFamily: "'Cormorant Garamond', Georgia, serif", fontStyle: 'italic', fontWeight: 300, fontSize: 'clamp(1.5rem,2.8vw,3rem)', color: '#fff', lineHeight: 1.45, margin: '0 auto 1.2rem', maxWidth: 700 }}>
            Hand-painted chinoiserie wallpaper. Tennessee marble. An arched cabinet that continues the motif of every door in the house.
          </p>
          <p style={{ fontFamily: SERIF, fontWeight: 300, fontSize: 'clamp(0.85rem,1.1vw,1rem)', color: CREAM, opacity: 0.45, lineHeight: 2, maxWidth: 520, margin: '0 auto' }}>
            Fuchsia ground. The only room in the house that announces itself in color. The rest of the house is restrained. This room is not. It is correct that way.
          </p>
        </Fade>
      </section>

      {/* == 10 LIBRARY == */}
      <CinematicReveal
        eyebrow="The Library"
        headline="Designed in 2000.<br/><em style='font-weight:300'>Built to last another century.</em>"
        body="The library sits at the exact center of the first floor. Kitchen to the left. Study to the right. The house was planned around it. Floor-to-ceiling shelving. Rolling ladder. Brass chandelier. It does not feel added. It feels inevitable."
        img={I.libraryWide}
        photos={G.library}
        onOpen={openLB}
        dark
      />

      {/* == 11 STUDY == */}
      <CinematicReveal flip
        eyebrow="The Study"
        headline="Same panel details<br/><em style='font-weight:300'>as the dining room. Drawn that way.</em>"
        body="Same profiles, same proportions -- 84 years apart. The 1916 millwork matched exactly. The study sits apart from the sleeping rooms, accessed by its own private stair. You go there to think. The room does not announce itself. It simply holds."
        img={I.officeTall}
        photos={G.study}
        onOpen={openLB}
      />

      {/* == O'SHEA INTERSTITIAL == */}
      <section style={{ position: 'relative', overflow: 'hidden', padding: 'clamp(4rem,7vw,6rem) clamp(2rem,14vw,18rem)', textAlign: 'center' }}>
        <div style={{ position: 'absolute', inset: 0, background: '#0a0a0a', zIndex: 0 }} />
        <div style={{ position: 'relative', zIndex: 2 }}>
          <Fade>
            <Eye center>Thomas O'Shea, Architect -- Durham, NC -- 2000</Eye>
            <GoldLine center />
            <h2 style={{ fontFamily: SERIF, fontWeight: 400, fontSize: 'clamp(2.2rem,4vw,5.5rem)', color: '#fff', lineHeight: 1.12, margin: '2rem auto', letterSpacing: '-0.015em', maxWidth: 860 }}>
              The interior was gutted.<br/><em style={{ fontWeight: 300 }}>None of it visible now.</em>
            </h2>
            <p style={{ fontFamily: SERIF, fontWeight: 300, fontSize: 'clamp(0.9rem,1.2vw,1.08rem)', color: CREAM, opacity: 0.65, lineHeight: 2.1, maxWidth: 720, margin: '0 auto' }}>
              Every pipe replaced. Every wire replaced. New Marvin windows throughout -- matched to the original profiles. Seven fireplaces cleaned, new dampers, gas logs fitted. Then the finish work began. Fifteen sheets of drawings. Every cornice profile copied from what was already there. The primary suite fireplace brackets drawn at full scale before a single piece was cut. The result does not look like 2000. It looks like 1916. The drawings go to the new owner.
            </p>
          </Fade>
        </div>
      </section>

      {/* == 12 WHP HISTORY == */}
      <section style={{ position: 'relative', overflow: 'hidden', minHeight: 'clamp(600px,85vh,960px)', display: 'flex', alignItems: 'center' }}>
        <div style={{ position: 'absolute', inset: 0, backgroundImage: `url(${I.whp})`, backgroundSize: 'cover', backgroundPosition: 'center 15%', zIndex: 0 }} />
        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(to right, rgba(4,4,4,0.96) 0%, rgba(4,4,4,0.78) 42%, rgba(4,4,4,0.20) 100%)', zIndex: 1 }} />
        <div style={{ position: 'relative', zIndex: 2, padding: 'clamp(4rem,8vw,7rem) clamp(2rem,8vw,10rem)', maxWidth: 680 }}>
          <Fade>
            <Eye>Walter Hines Page -- 1855 to 1918</Eye>
            <GoldLine />
            <h2 style={{ fontFamily: SERIF, fontWeight: 400, fontSize: 'clamp(2.5rem,4.5vw,6rem)', color: '#fff', lineHeight: 1.08, margin: '0 0 2rem', letterSpacing: '-0.012em' }}>
              He named it Garran Hill.<br/><em style={{ fontWeight: 300 }}>He never walked through the door.</em>
            </h2>
            <p style={{ fontFamily: SERIF, fontWeight: 300, fontSize: 'clamp(0.9rem,1.2vw,1.1rem)', color: CREAM, opacity: 0.72, lineHeight: 2.15, margin: '0 0 1.4rem' }}>
              Walter Hines Page bought a thousand-acre farm outside Pinehurst in February 1913. He named it Garran Hill. Six weeks later, Woodrow Wilson made him Ambassador to the Court of St. James. He sailed for London in May. He never came back.
            </p>
            <p style={{ fontFamily: SERIF, fontWeight: 300, fontSize: 'clamp(0.9rem,1.2vw,1.1rem)', color: CREAM, opacity: 0.72, lineHeight: 2.15, margin: '0 0 1.4rem' }}>
              From London he wrote about the farm constantly. The farm -- the farm -- the farm. He died in Pinehurst in December 1918. He was carried off the train at Aberdeen. His last words: "Well, Frank, I did get here after all, didn't I?"
            </p>
            <p style={{ fontFamily: SERIF, fontStyle: 'italic', fontWeight: 300, fontSize: 'clamp(1rem,1.4vw,1.2rem)', color: '#fff', opacity: 0.85, lineHeight: 1.8, margin: 0, maxWidth: 560 }}>
              Westminster Abbey named him "The friend of Britain in her sorest need." The house he never slept in has outlasted everything.
            </p>
          </Fade>
        </div>
      </section>

      {/* == 13 PRIMARY SUITE == */}
      <CinematicReveal
        eyebrow="The Primary Suite"
        headline="The master suite was a commission,<br/><em style='font-weight:300'>not a renovation.</em>"
        body="Drawn from scratch in 2000 to match the proportions of 1916. The fireplace brackets designed at full scale before a single piece was cut. Three closets. Primary bath with soaking tub and separate shower -- designed as a room, not a fixture list. The suite sits apart from the rest of the house. You enter it differently."
        img={I.masterBedBath}
        dark
      />

      {/* == PRIMARY BATH SPLIT == */}
      <section style={{ display: 'flex', minHeight: 'clamp(360px,52vh,580px)', overflow: 'hidden' }}>
        <div style={{ flex: '0 0 55%', backgroundImage: `url(${I.masterBedBath2})`, backgroundSize: 'cover', backgroundPosition: 'center center', minHeight: 380 }} />
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: 'clamp(3rem,6vw,5.5rem) clamp(2.5rem,5vw,5rem)', background: '#0a0a0a' }}>
          <Fade>
            <Eye>The Primary Bath</Eye>
            <GoldLine />
            <h3 style={{ fontFamily: SERIF, fontWeight: 400, fontSize: 'clamp(2rem,3.5vw,4.5rem)', color: '#fff', lineHeight: 1.1, margin: '0 0 1.2rem', letterSpacing: '-0.012em' }}>
              Soaking tub.<br/><em style={{ fontWeight: 300 }}>Separate shower. Jacuzzi.</em>
            </h3>
            <p style={{ fontFamily: SERIF, fontWeight: 300, fontSize: 'clamp(0.88rem,1.1vw,1rem)', color: CREAM, opacity: 0.55, lineHeight: 2.1, margin: 0 }}>
              Designed as a room. Not a fixture list. The proportions were specified in the 2000 drawings. Two additional bedrooms have their own whirlpool tubs. The house was built for people who stay.
            </p>
          </Fade>
        </div>
      </section>

      {/* == 14 BEDROOMS == */}
      <CinematicReveal
        eyebrow="The Other Bedrooms"
        headline="Three more rooms.<br/><em style='font-weight:300'>Each with its own fireplace.</em>"
        body="The yellow bedroom and the nursery share a balcony over the grounds. The rose suite has a Georgian fireplace with original surround. Every room has its own bath. The Wee Cottage -- arrived by sky crane, set exactly where it was meant to be -- gives the property a fifth sleeping option entirely its own."
        img={I.bed2}
        photos={G.bedrooms}
        onOpen={openLB}
        dark
      />

      {/* == 15 SEVEN FIREPLACES == */}
      <section style={{ background: '#0a0a0a', padding: 'clamp(5rem,8vw,7rem) clamp(2rem,6vw,5rem)' }}>
        <div style={{ maxWidth: 1100, margin: '0 auto' }}>
          <Fade>
            <p style={{ fontFamily: "'Cormorant Garamond', Georgia, serif", fontStyle: 'normal', fontWeight: 300, fontSize: 'clamp(4rem,10vw,12rem)', color: 'rgba(201,169,110,0.12)', lineHeight: 1, margin: '0 0 0.2rem', letterSpacing: '-0.02em', textAlign: 'left' }}>7</p>
            <Eye>Seven Fireplaces</Eye>
            <GoldLine />
            <p style={{ fontFamily: SERIF, fontWeight: 300, fontSize: 'clamp(0.9rem,1.2vw,1.05rem)', color: CREAM, opacity: 0.62, lineHeight: 2.1, maxWidth: 680, margin: '0 0 3.5rem' }}>
              Every one original. Every one working. Six fitted with gas logs. The seventh -- the Drawing Room -- burns wood. The mantels were specified individually. No two are the same.
            </p>
          </Fade>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 3 }}>
            {G.fireplaces.map((p,i) => (
              <div key={i} onClick={() => openLB(G.fireplaces, i)}
                style={{ position: 'relative', paddingBottom: '75%', backgroundImage: `url(${p.src})`, backgroundSize: 'cover', backgroundPosition: 'center', cursor: 'zoom-in', overflow: 'hidden' }}>
                <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 50%)' }} />
                <p style={{ position: 'absolute', bottom: '1rem', left: '1.2rem', fontFamily: SERIF, fontStyle: 'italic', fontSize: '0.85rem', color: 'rgba(255,255,255,0.7)', margin: 0 }}>{p.caption}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* == DOORKNOB MOMENT == */}
      <section style={{ position: 'relative', overflow: 'hidden', minHeight: 'clamp(520px,72vh,820px)', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#0a0a0a' }}>
        <div style={{ position: 'absolute', inset: 0, zIndex: 0, background: 'radial-gradient(ellipse 80% 60% at 30% 50%, rgba(18,14,8,1) 0%, rgba(8,6,3,1) 55%, rgba(0,0,0,1) 100%)' }} />
        <div style={{ position: 'absolute', inset: 0, zIndex: 1, background: 'radial-gradient(ellipse 40% 70% at 62% 48%, rgba(201,169,110,0.07) 0%, transparent 65%)', mixBlendMode: 'screen' }} />
        <div style={{ position: 'relative', zIndex: 10, display: 'flex', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'center', gap: 'clamp(3rem,6vw,8rem)', padding: 'clamp(4rem,8vw,7rem) clamp(2rem,8vw,10rem)', width: '100%', maxWidth: 1200, margin: '0 auto' }}>
          <div style={{ position: 'relative', flex: '0 0 auto' }}>
            <div style={{ width: 'clamp(220px,22vw,320px)', height: 'clamp(380px,52vh,620px)', backgroundImage: `url(${I.doorknob})`, backgroundSize: 'cover', backgroundPosition: 'center', position: 'relative', zIndex: 2 }} />
            <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, height: 'clamp(80px,12vh,160px)', backgroundImage: `url(${I.doorknob})`, backgroundSize: 'cover', backgroundPosition: 'center', transform: 'scaleY(-1)', maskImage: 'linear-gradient(to bottom, rgba(0,0,0,0.28) 0%, transparent 100%)', WebkitMaskImage: 'linear-gradient(to bottom, rgba(0,0,0,0.28) 0%, transparent 100%)', zIndex: 1 }} />
          </div>
          <div style={{ flex: '1 1 280px', maxWidth: 460 }}>
            <Fade>
              <Eye>The Hardware</Eye>
              <GoldLine />
              <h3 style={{ fontFamily: SERIF, fontWeight: 400, fontSize: 'clamp(2.4rem,4vw,5.5rem)', color: '#fff', lineHeight: 1.05, margin: '0 0 1.8rem', letterSpacing: '-0.015em' }}>
                Brass. Original.<br/><em style={{ fontWeight: 300, color: CREAM }}>Still on every door.</em>
              </h3>
              <p style={{ fontFamily: SERIF, fontWeight: 300, fontSize: 'clamp(0.88rem,1.1vw,1.05rem)', color: CREAM, opacity: 0.6, lineHeight: 2.2, margin: 0 }}>
                The key plates, the keys, the hinges -- specified in 1916, never replaced. You can feel the weight of them.
              </p>
            </Fade>
          </div>
        </div>
      </section>

      {/* == 16 GROUNDS == */}
      <FullBleed
        src={I.roseMoney}
        darken={0.35}
        minH="80vh"
        bgPos="center 55%"
        align="left"
        eyebrow="The Grounds"
        headline="The rose garden runs<br/><em style='font-weight:300'>the full length of the pool wall.</em>"
        body="4.15 acres within mature hardwoods. The rose garden was planted from bare ground over twenty years. There is nothing else like it in Pinehurst. A side porch with its own sink -- hot and cold -- cabinets, shelves. Built for someone who gardens seriously."
      />

      {/* == ROSE WALL PULL QUOTE == */}
      <PullQuote
        quote="The wall does two things: it holds the pool and it holds the roses."
        bg={I.roseWall}
      />

      {/* == 17 POOL == */}
      <CinematicReveal flip
        eyebrow="The Pool"
        headline="20 by 40.<br/><em style='font-weight:300'>Salt water. Converted 2022.</em>"
        body="20 by 40. Salt water, converted 2022. Original brick surround. Wrought iron arch gates. 28-zone irrigation from a 130-foot private well. All utilities underground. The pool sits at the edge of the rose garden -- the wall holds both."
        img={I.pool}
        photos={G.grounds}
        onOpen={openLB}
        dark
      />

      {/* == IRIS / GARDEN STRIP == */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 3, maxHeight: 420 }}>
        {[
          { src: I.iris,    label: 'Irises',   body: 'April. Every year. Uninstructed.' },
          { src: I.azalea,  label: 'Azaleas',  body: 'Back yard. Under the magnolia.' },
          { src: I.sepia,   label: 'The Gate', body: 'Wrought iron. Original. Still on the hinges.' },
        ].map((f,i) => (
          <div key={i} onClick={() => openLB([{ src: f.src, caption: f.body }], 0)}
            style={{ position: 'relative', backgroundImage: `url(${f.src})`, backgroundSize: 'cover', backgroundPosition: 'center', cursor: 'zoom-in', minHeight: 280, overflow: 'hidden' }}>
            <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(to top, rgba(0,0,0,0.78) 0%, transparent 55%)' }} />
            <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, padding: '2rem 1.6rem 1.4rem' }}>
              <p style={{ fontFamily: 'sans-serif', fontSize: '7px', letterSpacing: '0.32em', textTransform: 'uppercase', color: GOLD, margin: '0 0 0.4rem' }}>{f.label}</p>
              <p style={{ fontFamily: SERIF, fontStyle: 'italic', color: 'rgba(255,255,255,0.75)', fontSize: '0.85rem', margin: 0 }}>{f.body}</p>
            </div>
          </div>
        ))}
      </div>

      {/* == 18 STEWARDSHIP / BETTY == */}
      <CinematicReveal
        eyebrow="Stewardship"
        headline="She planted this garden from scratch.<br/><em style='font-weight:300'>This is what twenty years of care looks like.</em>"
        body="Betty Dumaine planted every rose. She kept foxhounds and peacocks. The Queen of Thailand stayed here. Four families have called Garran Hill home. Each one added something. Nothing was taken away."
        img={I.betty}
        dark
      />

      {/* == BLUE FOX == */}
      <FullBleed
        src={I.bluefox}
        darken={0.55}
        minH="65vh"
        bgPos="center"
        align="center"
      >
        <div style={{ textAlign: 'center' }}>
          <Eye center>Blue Fox -- My Irish Hunter -- 1946 to 1969</Eye>
          <GoldLine center />
          <p style={{ fontFamily: SERIF, fontStyle: 'italic', fontWeight: 300, fontSize: 'clamp(1.6rem,3vw,3.2rem)', color: '#fff', lineHeight: 1.45, margin: '0 auto 1.4rem', maxWidth: 680, letterSpacing: '-0.01em' }}>
            Betty Dumaine put the first flowers here.<br/>Someone still does.
          </p>
          <p style={{ fontFamily: SERIF, fontWeight: 300, fontSize: 'clamp(0.88rem,1.1vw,1rem)', color: CREAM, opacity: 0.55, lineHeight: 2, maxWidth: 500, margin: '0 auto' }}>
            Betty Dumaine's horse. Buried on the grounds she kept for twenty years. The stone has not moved since 1969.
          </p>
        </div>
      </FullBleed>

      {/* == 19 INFRASTRUCTURE == */}
      <section style={{ position: 'relative', padding: 'clamp(5rem,9vw,8rem) clamp(2rem,8vw,10rem)', overflow: 'hidden' }}>
        <div style={{ position: 'absolute', inset: 0, backgroundImage: `url(${ownExt('70e262eac_up1.jpg')})`, backgroundSize: 'cover', backgroundPosition: 'center 40%', zIndex: 0 }} />
        <div style={{ position: 'absolute', inset: 0, background: 'rgba(4,4,4,0.91)', zIndex: 1 }} />
        <div style={{ position: 'relative', zIndex: 2 }}>
          <Fade>
            <Eye>Infrastructure</Eye>
            <GoldLine />
            <h2 style={{ fontFamily: SERIF, fontWeight: 400, fontSize: 'clamp(3rem,5.5vw,7rem)', color: '#fff', lineHeight: 1.06, margin: '0 0 3.5rem', letterSpacing: '-0.012em' }}>
              Built to run.
            </h2>
          </Fade>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: 'clamp(1.5rem,3vw,2.5rem) clamp(2rem,4vw,3.5rem)' }}>
            {[
              { label: 'Pool',                  body: '20x40 salt water, converted 2022. Brick surround with original wrought iron gate.' },
              { label: 'Hot Water',             body: 'Three heaters -- 80 gallon primary + two 40-gallon units. Three whirlpool tubs.' },
              { label: 'Attic + Cedar Closet',  body: '21x43 ft attic, fully floored. Cedar closet at the top of the third-floor stairs.' },
              { label: 'The Basement',          body: 'Stone walls. Four rooms. Climate controlled. Wine rack, refrigerator, freezer.' },
              { label: 'Fireplaces',            body: 'Seven fireplaces. Six with gas logs. One wood-burning. All original. All working.' },
              { label: 'Climate',               body: 'Five-zone system engineered to protect original architecture. 250-gallon underground propane.' },
              { label: 'Water',                 body: '130-foot private well. 28-zone irrigation throughout the grounds.' },
              { label: 'Parking',               body: 'Twelve cars northeast. Six at the pool. Circular drive. All within 4.15 gated acres.' },
            ].map((item,i) => (
              <Fade key={i}>
                <div style={{ borderTop: '1px solid rgba(201,169,110,0.22)', paddingTop: 'clamp(1.2rem,2vw,1.6rem)' }}>
                  <p style={{ fontFamily: 'sans-serif', fontSize: '7.5px', letterSpacing: '0.28em', textTransform: 'uppercase', color: GOLD, margin: '0 0 0.7rem' }}>{item.label}</p>
                  <p style={{ fontFamily: SERIF, fontWeight: 300, fontSize: 'clamp(0.88rem,1vw,0.98rem)', color: CREAM, opacity: 0.58, lineHeight: 1.9, margin: 0 }}>{item.body}</p>
                </div>
              </Fade>
            ))}
          </div>
        </div>
      </section>

      {/* == 20 1916 SAPLINGS == */}
      <CinematicReveal
        eyebrow="Est. 1916"
        headline="In 1916, those were saplings.<br/><em style='font-weight:300'>Now they are a forest.</em>"
        body="The oaks along the drive were planted with the house. One hundred and nine years. The canopy closes over the circular drive and does not let the outside world in. That is not an accident. The land was chosen for this."
        img={I.img1916}
        dark
      />

      {/* == 21 FULL GALLERY == */}
      <section id="gallery" style={{ background: '#0a0a0a', padding: 'clamp(4rem,7vw,6rem) clamp(1.5rem,4vw,3rem)' }}>
        <Fade>
          <Eye center>The Full Estate</Eye>
          <GoldLine center />
          <p style={{ fontFamily: SERIF, fontStyle: 'italic', fontWeight: 300, fontSize: 'clamp(1rem,1.5vw,1.3rem)', color: CREAM, opacity: 0.5, textAlign: 'center', margin: '0 auto 3rem', maxWidth: 560 }}>
            Every room. Every detail. Every corner of 4.15 acres.
          </p>
        </Fade>
        <FilmStrip photos={G.all} onOpen={openLB} />
      </section>

      {/* == 22 AERIAL == */}
      <FullBleed
        src={I.aerial}
        darken={0.45}
        minH="75vh"
        bgPos="center"
        align="center"
        eyebrow="4.15 Acres -- Pinehurst ETJ"
        headline="The world outside these gates<br/><em style='font-weight:300'>does not exist here.</em>"
      />

      {/* == 23 TWILIGHT / FINAL == */}
      <FullBleed
        src={I.dusk2}
        darken={0.52}
        minH="80vh"
        bgPos="center"
        align="center"
        eyebrow="$4,250,000 -- Offered Exclusively"
        headline="Garran Hill is ready.<br/><em style='font-weight:300'>The question is whether you are.</em>"
      >
        <div style={{ marginTop: '2.5rem', textAlign: 'center' }}>
          <button onClick={() => setShowInq(true)}
            style={{ background: 'none', border: `1px solid ${GOLD}`, color: GOLD, padding: '0.85rem 2.8rem', fontFamily: 'sans-serif', fontSize: '8px', letterSpacing: '0.34em', textTransform: 'uppercase', cursor: 'pointer' }}>
            Private Inquiry
          </button>
        </div>
      </FullBleed>


            {/* == FOOTER == */}
      <Footer onInquire={() => setShowInq(true)} />
    </div>
  );
}


// Mount
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(GarranHillV6));
  </script>
</body>
</html>
