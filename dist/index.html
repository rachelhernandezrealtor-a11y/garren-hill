<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Rachel Hernandez Studio</title>
  <style>
    :root {
      --dark: #0a0a0a;
      --gold: #C9A96E;
      --cream: #F5F0E8;
      --muted: rgba(245, 240, 232, .58);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--dark);
      color: var(--cream);
      font-family: "Cormorant Garamond", Georgia, serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: clamp(24px, 6vw, 72px);
    }

    main {
      text-align: center;
      user-select: none;
    }

    .mark {
      font-size: clamp(5.5rem, 22vw, 16rem);
      font-weight: 300;
      line-height: .82;
      letter-spacing: .06em;
    }

    .rule {
      width: min(160px, 32vw);
      height: 1px;
      margin: clamp(22px, 4vw, 38px) auto;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .name {
      margin: 0;
      color: var(--gold);
      font-size: clamp(.78rem, 1.6vw, 1rem);
      letter-spacing: .32em;
      text-transform: uppercase;
    }

    .status {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.25rem);
    }
  </style>
</head>
<body>
  <main aria-label="Rachel Hernandez Studio">
    <div class="mark">RH</div>
    <div class="rule" aria-hidden="true"></div>
    <p class="name">Rachel Hernandez Studio</p>
    <p class="status">Private studio workspace.</p>
  </main>
</body>
</html>
