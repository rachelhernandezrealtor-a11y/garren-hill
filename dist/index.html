<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="0; url=/coco">
  <title>Rachel Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark: #0a0a0a;
      --gold: #C9A96E;
      --cream: #F5F0E8;
      --muted: rgba(245, 240, 232, .62);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--dark);
      color: var(--cream);
      font-family: "Cormorant Garamond", Georgia, serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 32px;
    }

    main {
      width: min(620px, 100%);
      border: 1px solid rgba(201, 169, 110, .34);
      padding: clamp(32px, 7vw, 64px);
      background: linear-gradient(180deg, rgba(201, 169, 110, .055), rgba(255, 255, 255, .018));
    }

    .kicker {
      color: var(--gold);
      font-size: .72rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(3rem, 9vw, 5rem);
      font-weight: 300;
      line-height: .95;
      margin: 0 0 18px;
    }

    p {
      color: var(--muted);
      font-size: clamp(1.15rem, 2.5vw, 1.38rem);
      line-height: 1.45;
      margin: 0 0 28px;
    }

    a {
      display: inline-block;
      border: 1px solid rgba(201, 169, 110, .5);
      color: var(--cream);
      padding: 13px 22px;
      text-decoration: none;
      font-size: 1.05rem;
    }

    a:focus,
    a:hover {
      background: var(--cream);
      color: var(--dark);
    }
  </style>
</head>
<body>
  <main>
    <div class="kicker">Rachel Studio</div>
    <h1>Opening Coco.</h1>
    <p>This private studio route opens the builder directly. Garran Hill preview stays inside Coco.</p>
    <a href="/coco">Open Coco</a>
  </main>
</body>
</html>
