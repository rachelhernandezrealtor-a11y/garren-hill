<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garran Hill</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Instrument+Sans:wght@300;400&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A96E;
      --gold-dim: rgba(201,169,110,0.35);
      --dark: #0A0A0A;
      --cream: rgba(245,240,232,0.92);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--dark); color: var(--cream); overflow-x: hidden; }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: clamp(1rem,2vw,1.6rem) clamp(1.5rem,4vw,4rem);
    }
    .nav-est {
      font-family: 'Instrument Sans', sans-serif;
      font-weight: 300; font-size: 0.62rem;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(245,240,232,0.4);
    }
    .nav-links { display: flex; gap: clamp(1.5rem,3vw,2.5rem); list-style: none; }
    .nav-links a {
      font-family: 'Instrument Sans', sans-serif;
      font-weight: 300; font-size: 0.62rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(245,240,232,0.5); text-decoration: none;
    }
    .nav-links a:hover { color: var(--gold); }

    /* HERO */
    .hero {
      position: relative;
      width: 100%; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--dark);
      overflow: hidden;
    }

    /* TITLE BLOCK */
    .title-block {
      position: relative; z-index: 2;
      text-align: center;
      padding: 0 clamp(1.5rem,6vw,6rem);
      padding-bottom: clamp(6rem,11vw,10rem); /* push up from stat bar */
      padding-left: clamp(2rem,5vw,5rem); /* compensate for Pinyon Script left lean */
    }
    .address-eyebrow {
      display: block;
      font-family: 'Instrument Sans', sans-serif;
      font-weight: 300; font-size: clamp(0.55rem,0.75vw,0.68rem);
      letter-spacing: 0.32em; text-transform: uppercase;
      color: rgba(245,240,232,0.38);
      margin-bottom: clamp(1.2rem,2.5vw,2rem);
    }
    .property-name {
      display: block;
      font-family: 'Pinyon Script', cursive;
      font-size: clamp(6rem,17vw,15rem);
      line-height: 0.88;
      color: var(--cream);
      text-shadow: 0 2px 60px rgba(0,0,0,0.3);
      display: block;
      margin-left: clamp(1rem,3vw,4rem); /* optical center for script font */
    }
    .subtitle {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-style: italic;
      font-size: clamp(0.75rem,1.05vw,0.95rem);
      letter-spacing: 0.14em;
      color: rgba(245,240,232,0.38);
      margin-top: clamp(1rem,2vw,1.8rem);
    }

    /* 1916 WATERMARK */
    .watermark-1916 {
      position: absolute;
      bottom: clamp(4rem,10vw,9rem); right: clamp(-1rem,0vw,0rem);
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(9rem,20vw,24rem);
      color: rgba(201,169,110,0.06);
      line-height: 1;
      pointer-events: none; user-select: none;
      z-index: 1;
    }

    /* STAT BAR */
    .stat-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      background: rgba(4,4,4,0.9);
      backdrop-filter: blur(14px);
      overflow: visible;
    }
    .stat-rule {
      width: 100%; height: 1px;
      background: linear-gradient(to right, transparent, rgba(201,169,110,0.85) 15%, #C9A96E 50%, rgba(201,169,110,0.85) 85%, transparent);
    }
    .stat-row {
      position: relative;
      display: flex; align-items: center; justify-content: space-around;
      padding: clamp(0.9rem,1.8vw,1.3rem) clamp(1rem,4vw,3rem);
    }
    .stat-item {
      display: flex; flex-direction: column;
      align-items: center; gap: 0.35rem;
      text-align: center; flex: 1;
    }
    .stat-num {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(1.6rem,2.6vw,2.8rem);
      line-height: 1; letter-spacing: 0.02em;
      background: linear-gradient(170deg,#FFFFFF 0%,#FDF6D8 8%,#F0D060 22%,#C9A96E 42%,#8B6914 70%,#4A2E08 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-label {
      font-family: 'Instrument Sans', sans-serif;
      font-weight: 300; font-size: 0.58rem;
      letter-spacing: 0.35em; text-transform: uppercase;
      color: rgba(201,169,110,0.5);
    }
    .stat-divider {
      width: 1px; height: 26px;
      background: rgba(201,169,110,0.2);
      flex-shrink: 0;
    }
    /* Crest gap — empty spacer in flex row */
    .crest-gap { flex: 1.6; }

    /* CREST — absolutely positioned, rises above top gold rule */
    .crest-medallion {
      position: absolute;
      top: 0; left: 50%;
      transform: translate(-50%, -55%);
      width: clamp(130px,14vw,190px);
      height: auto;
      z-index: 20;
      pointer-events: none;
      filter:
        drop-shadow(0 10px 36px rgba(0,0,0,0.95))
        drop-shadow(0 3px 10px rgba(0,0,0,0.8))
        drop-shadow(0 0 18px rgba(201,169,110,0.18));
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .property-name { font-size: clamp(5rem,21vw,8rem); }
      .title-block { padding-bottom: clamp(10rem,30vw,14rem); }
      .stat-divider { display: none; }
      .stat-row { flex-wrap: wrap; gap: 0.6rem 0; justify-content: center; }
      .stat-item { flex: 0 0 30%; }
      .crest-gap { display: none; }
      .crest-medallion {
        width: clamp(90px,20vw,120px);
        transform: translate(-50%, -50%);
      }
    }
    @media (max-width: 480px) {
      .stat-item { flex: 0 0 45%; }
      .stat-num { font-size: clamp(1.3rem,6vw,1.8rem); }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-est">Est. Garran Hill 1916</div>
    <ul class="nav-links">
      <li><a href="#">The Estate</a></li>
      <li><a href="#">The History</a></li>
      <li><a href="#">The Rooms</a></li>
      <li><a href="#">The Grounds</a></li>
    </ul>
  </nav>

  <section class="hero">
    <div class="title-block">
      <span class="address-eyebrow">200 Hollycrest Drive &nbsp;&middot;&nbsp; Pinehurst, North Carolina</span>
      <span class="property-name">Garran Hill</span>
      <span class="subtitle">Neo-Georgian &nbsp;&middot;&nbsp; A Neoclassical Monument &nbsp;&middot;&nbsp; Pinehurst &nbsp;&middot;&nbsp; 1916</span>
    </div>

    <div class="watermark-1916">1916</div>

    <div class="stat-bar">
      <div class="stat-rule"></div>
      <div class="stat-row">
        <div class="stat-item">
          <span class="stat-num">4</span>
          <span class="stat-label">Bedrooms</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-num">6</span>
          <span class="stat-label">Bathrooms</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-num">6,072</span>
          <span class="stat-label">Square Feet</span>
        </div>
        <div class="stat-divider"></div>
        <div class="crest-gap"></div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-num">4.15</span>
          <span class="stat-label">Acres</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-num">$4,250,000</span>
          <span class="stat-label">Offered At</span>
        </div>
      </div>
      <div class="stat-rule"></div>

      <img
        src="https://res.cloudinary.com/dghn2xpif/image/upload/gh_key/gh_crest_gloss_v2.png"
        alt="Garran Hill crest"
        class="crest-medallion">
    </div>
  </section>
</body>
</html>
