<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Coco | Rachel Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark: #0a0a0a;
      --gold: #C9A96E;
      --cream: #F5F0E8;
      --muted: rgba(245, 240, 232, .58);
      --faint: rgba(245, 240, 232, .18);
      --line: rgba(201, 169, 110, .34);
      --panel: rgba(18, 16, 13, .92);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--dark);
      color: var(--cream);
      font-family: "Cormorant Garamond", Georgia, serif;
    }

    body {
      display: grid;
      min-height: 100svh;
      overflow: hidden;
      padding: clamp(22px, 5vw, 48px);
      place-items: center;
    }

    body::before {
      content: "";
      position: fixed;
      width: min(760px, 88vw);
      height: min(760px, 88vw);
      border: 1px solid rgba(201, 169, 110, .09);
      pointer-events: none;
      transform: rotate(10deg);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 30%, rgba(201, 169, 110, .08), transparent 34%),
        linear-gradient(180deg, rgba(255, 255, 255, .025), transparent 42%);
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(620px, 100%);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(201, 169, 110, .06), rgba(255, 255, 255, .018)), var(--panel);
      padding: clamp(30px, 6vw, 58px);
      text-align: center;
    }

    .kicker {
      color: var(--gold);
      font-size: .72rem;
      letter-spacing: .32em;
      margin-bottom: 22px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.4rem, 12vw, 6.6rem);
      font-weight: 300;
      line-height: .95;
    }

    p {
      max-width: 430px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.6vw, 1.35rem);
      line-height: 1.45;
    }

    form {
      display: grid;
      max-width: 390px;
      margin: 34px auto 0;
      gap: 14px;
    }

    label {
      color: var(--gold);
      font-size: .72rem;
      letter-spacing: .22em;
      text-align: left;
      text-transform: uppercase;
    }

    input,
    button {
      width: 100%;
      min-height: 54px;
      border: 1px solid var(--line);
      color: var(--cream);
      font: inherit;
      font-size: 1.18rem;
      letter-spacing: .02em;
      padding: 15px 16px;
    }

    input {
      background: rgba(10, 10, 10, .66);
      text-align: center;
    }

    input::placeholder {
      color: rgba(245, 240, 232, .34);
    }

    input:focus-visible,
    button:focus-visible {
      outline: 1px solid var(--gold);
      outline-offset: 3px;
    }

    button {
      cursor: pointer;
      background: var(--cream);
      color: var(--dark);
      transition: transform .18s ease, background .18s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .note {
      min-height: 1.4em;
      margin-top: 16px;
      color: var(--muted);
      font-size: 1rem;
    }

    .safe {
      margin-top: 28px;
      border-top: 1px solid var(--faint);
      padding-top: 18px;
      color: rgba(245, 240, 232, .48);
      font-size: .95rem;
      line-height: 1.45;
    }

    @media (max-width: 520px) {
      body {
        overflow: auto;
      }

      main {
        text-align: left;
      }

      p {
        margin-left: 0;
      }

      input {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="kicker">Rachel Studio</div>
    <h1>Private.</h1>
    <p>Coco opens after the Studio key unlocks this browser.</p>

    <form id="unlock">
      <label for="pin">Studio key</label>
      <input id="pin" name="pin" type="password" autocomplete="current-password" placeholder="Enter admin code" required>
      <button type="submit">Open Coco</button>
    </form>

    <div id="message" class="note" role="status"></div>
    <div class="safe">Private workspace. Drafts, tools, and launch decisions stay protected here.</div>
  </main>

  <script>
    const form = document.getElementById("unlock");
    const message = document.getElementById("message");
    const pin = document.getElementById("pin");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Checking the Studio key...";

      try {
        const response = await fetch("/studio/session", {
          method: "POST",
          headers: { "content-type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ pin: pin.value })
        });
        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          message.textContent = payload.next || payload.error || "That did not unlock.";
          return;
        }

        message.textContent = "Unlocked. Opening Coco...";
        window.location.assign("/studio/agent");
      } catch (error) {
        message.textContent = "The private door did not answer. Try /studio/agent directly, or tell Codex.";
      }
    });
  </script>
</body>
</html>
