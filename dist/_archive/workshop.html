<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="refresh" content="2; url=/studio">
<title>Workshop Moved | Rachel Hernandez Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #0a0a0a;
    --gold: #C9A96E;
    --cream: #F5F0E8;
    --muted: rgba(245, 240, 232, 0.58);
  }

  * { box-sizing: border-box; }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: var(--dark);
    color: var(--cream);
    font-family: "Cormorant Garamond", Georgia, serif;
  }

  body {
    display: grid;
    min-height: 100vh;
    place-items: center;
    padding: 32px;
  }

  main {
    width: min(680px, 100%);
    border: 1px solid rgba(201, 169, 110, 0.42);
    padding: clamp(34px, 7vw, 72px);
  }

  .kicker {
    color: var(--gold);
    font-size: 12px;
    letter-spacing: 0.36em;
    line-height: 1.6;
    margin: 0 0 28px;
    text-transform: uppercase;
  }

  h1 {
    font-size: clamp(44px, 8vw, 92px);
    font-weight: 300;
    letter-spacing: 0;
    line-height: 0.94;
    margin: 0 0 24px;
  }

  p {
    color: var(--muted);
    font-size: clamp(20px, 2.4vw, 27px);
    line-height: 1.35;
    margin: 0 0 30px;
  }

  a {
    color: var(--cream);
    display: inline-block;
    font-size: 14px;
    letter-spacing: 0.22em;
    padding-top: 18px;
    text-decoration: none;
    text-transform: uppercase;
  }

  a::after {
    background: var(--gold);
    content: "";
    display: block;
    height: 1px;
    margin-top: 10px;
    width: 100%;
  }
</style>
</head>
<body>
  <main>
    <p class="kicker">Rachel Studio | Coco</p>
    <h1>Workshop Moved</h1>
    <p>Coco has the room now. The old workshop has been retired, and the protected Studio workspace is the only working door.</p>
    <a href="/studio">Open Protected Studio</a>
  </main>
</body>
</html>
