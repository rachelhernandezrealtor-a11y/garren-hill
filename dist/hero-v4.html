<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garran Hill</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Instrument+Sans:wght@300;400&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
  <style>

    /* ── TOKENS ── */
    :root {
      --gold:        #C9A96E;
      --gold-bright: #E8C97A;
      --dark:        #0A0A0A;
      --cream:       rgba(245,241,232,0.94);
      --muted:       rgba(245,241,232,0.32);

      /* Crest is the anchor. Everything derives from this one value. */
      --crest-w: clamp(140px, 16vw, 260px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--dark); color: var(--cream); overflow-x: hidden; }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: clamp(0.9rem,1.4vw,1.2rem) clamp(1.5rem,4vw,4rem);
    }
    .nav-est {
      font-family: 'Instrument Sans', sans-serif;
      font-weight: 300; font-size: clamp(0.5rem,0.58vw,0.6rem);
      letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted);
    }
    .nav-links { display: flex; gap: clamp(1.4rem,2vw,2.4rem); list-style: none; }
    .nav-links a {
      font-family: 'Instrument Sans', sans-serif;
      font-weight: 300; font-size: clamp(0.5rem,0.58vw,0.6rem);
      letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(245,241,232,0.35); text-decoration: none;
      transition: color 0.3s;
    }
    .nav-links a:hover { color: var(--gold); }

    /* ── HERO ── */
    .hero {
      position: relative; width: 100%; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--dark); overflow: hidden;
    }

    /* ── TITLE BLOCK ── */
    .title-block {
      position: relative; z-index: 2;
      text-align: center;
      /* Bottom padding = how far crest rises above rule + bar content height */
      padding-bottom: calc(var(--crest-w) * 0.5 + 4.5rem);
      width: 100%;
    }
    .address-eyebrow {
      display: block;
      font-family: 'Instrument Sans', sans-serif;
      font-weight: 300; font-size: clamp(0.48rem,0.58vw,0.62rem);
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--muted);
      margin-bottom: clamp(1rem,2.2vh,1.8rem);
    }
    .property-name {
      display: block;
      font-family: 'Mrs Saint Delafield', cursive;
      font-size: clamp(5rem, 13vw, 12.5rem);
      line-height: 0.88;
      color: var(--cream);
      text-shadow: 0 0 120px rgba(201,169,110,0.06), 0 2px 40px rgba(0,0,0,0.5);
      padding-left: clamp(0.8rem,1.8vw,2rem);
    }
    .subtitle {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-style: italic;
      font-size: clamp(0.62rem,0.82vw,0.85rem);
      letter-spacing: 0.13em;
      color: rgba(245,241,232,0.25);
      margin-top: clamp(0.9rem,2vh,1.6rem);
    }

    /* ── 1916 WATERMARK ── */
    .watermark {
      position: absolute;
      bottom: clamp(3.5rem,9vw,8rem); right: clamp(-3rem,-1.5vw,0);
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(10rem,20vw,26rem);
      color: rgba(201,169,110,0.045);
      line-height: 1; pointer-events: none; user-select: none;
      z-index: 1; letter-spacing: -0.02em;
    }

    /* ══════════════════════════════════════════
       STAT BAR
       The law: single horizon, no wrap, fluid.
       Crest is the anchor. Stats flex around it.
       ══════════════════════════════════════════ */
    .stat-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      background: rgba(8,8,8,0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: visible; /* crest rises above */
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Double rule — Georgian frame */
    .rule-top {
      position: relative; height: 5px; overflow: visible;
    }
    .rule-top::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(
        to right,
        transparent 0%, rgba(201,169,110,0.18) 5%,
        var(--gold) 22%, var(--gold-bright, #E8C97A) 50%,
        var(--gold) 78%, rgba(201,169,110,0.18) 95%, transparent 100%
      );
    }
    .rule-top::after {
      content: '';
      position: absolute; top: 4px; left: 0; right: 0; height: 1px;
      background: linear-gradient(
        to right,
        transparent 0%, rgba(201,169,110,0.06) 8%,
        rgba(201,169,110,0.28) 30%, rgba(201,169,110,0.45) 50%,
        rgba(201,169,110,0.28) 70%, rgba(201,169,110,0.06) 92%, transparent 100%
      );
    }

    /* ── THE FLUID FLEXBOX ROW ── */
    .stat-row {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;          /* NEVER breaks to second line */
      justify-content: space-between;
      align-items: center;
      width: 100%;
      /* Vertical padding scales with viewport — bar height stays proportional */
      padding: clamp(0.75rem, 1.4vh, 1.2rem) clamp(0.8rem, 2.5vw, 2.8rem);
      gap: 0;
    }

    /* ── STAT ITEM ── */
    .stat-item {
      /* flex: 1 1 0 — each item gets equal share of remaining space */
      flex: 1 1 0;
      min-width: 0;              /* Allows shrinking below content size */
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.18rem,0.35vh,0.35rem);
      text-align: center;
      padding: 0 clamp(0.2rem,0.5vw,0.6rem);
      /* Subtle divider — thins at small sizes */
      border-right: 1px solid rgba(201,169,110,0.12);
    }
    .stat-item:last-child { border-right: none; }

    /* Number — cream, Cormorant, scales fluidly */
    .stat-num {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      /* clamp: min / fluid / max — never breaks */
      font-size: clamp(0.95rem, 1.85vw, 2.2rem);
      line-height: 1;
      letter-spacing: 0.01em;
      color: var(--cream);
      white-space: nowrap;
    }

    /* Label — proportional. Not whispered. */
    .stat-label {
      font-family: 'Instrument Sans', sans-serif;
      font-weight: 300;
      /* Scales down gracefully — readable at all breakpoints */
      font-size: clamp(0.42rem, 0.55vw, 0.6rem);
      letter-spacing: clamp(0.1em, 0.22vw, 0.26em);
      text-transform: uppercase;
      color: rgba(201,169,110,0.48);
      white-space: nowrap;
    }

    /* ── CREST SLOT ── */
    /* Fixed-width column = crest width + breathing room either side */
    .crest-slot {
      flex: 0 0 var(--crest-w);   /* Does not grow or shrink — holds space for crest */
      min-width: var(--crest-w);
      height: 1px;                /* No visible height — crest is absolute */
      position: relative;
    }

    /* ── CREST MEDALLION — the anchor ── */
    .crest {
      position: absolute;
      left: 50%;
      /* bottom of image aligns to the top rule, then rises by % of own height */
      bottom: calc(100% + 5px); /* sits just above the double rule */
      transform: translateX(-50%) translateY(38%);
      width: var(--crest-w);
      height: auto;
      z-index: 30;
      pointer-events: none;
      filter:
        drop-shadow(0 -1px 8px rgba(201,169,110,0.14))
        drop-shadow(0 6px 28px rgba(0,0,0,0.9))
        drop-shadow(0 2px 8px rgba(0,0,0,0.8))
        drop-shadow(0 0 22px rgba(201,169,110,0.1));
    }

    /* Bottom rule */
    .rule-bottom {
      height: 1px;
      background: linear-gradient(
        to right,
        transparent 0%, rgba(201,169,110,0.08) 20%,
        rgba(201,169,110,0.18) 50%,
        rgba(201,169,110,0.08) 80%, transparent 100%
      );
    }

    /* ══════════════════════════════
       RESPONSIVE — fluid, not broken
       ══════════════════════════════ */

    /* Tablet: hide some nav links */
    @media (max-width: 860px) {
      .nav-links li:nth-child(n+3) { display: none; }
    }
    @media (max-width: 600px) {
      .nav-links { display: none; }
    }

    /* Mobile: the flexbox law still holds.
       We just reduce crest size and font floors. */
    @media (max-width: 480px) {
      :root { --crest-w: 110px; }
      .property-name { font-size: clamp(3.8rem, 16vw, 5.5rem); }
      .title-block { padding-bottom: calc(110px * 0.5 + 4rem); }
      .stat-num { font-size: clamp(0.78rem, 3.8vw, 1.1rem); }
      .stat-label {
        font-size: clamp(0.36rem, 1.6vw, 0.46rem);
        letter-spacing: 0.08em;
      }
      .watermark { display: none; }
    }

  </style>
</head>
<body>

  <nav>
    <div class="nav-est">Est. Garran Hill &nbsp;·&nbsp; 1916</div>
    <ul class="nav-links">
      <li><a href="#">The Estate</a></li>
      <li><a href="#">The History</a></li>
      <li><a href="#">The Rooms</a></li>
      <li><a href="#">The Grounds</a></li>
    </ul>
  </nav>

  <section class="hero">

    <div class="title-block">
      <span class="address-eyebrow">200 Hollycrest Drive &nbsp;&middot;&nbsp; Pinehurst, North Carolina</span>
      <span class="property-name">Garran Hill</span>
      <span class="subtitle">Neo-Georgian &nbsp;&middot;&nbsp; 110 Years of Provenance &nbsp;&middot;&nbsp; Pinehurst &nbsp;&middot;&nbsp; 1916</span>
    </div>

    <div class="watermark">1916</div>

    <div class="stat-bar">

      <div class="rule-top"></div>

      <div class="stat-row">

        <div class="stat-item">
          <span class="stat-num">4</span>
          <span class="stat-label">Bedrooms</span>
        </div>

        <div class="stat-item">
          <span class="stat-num">6</span>
          <span class="stat-label">Bathrooms</span>
        </div>

        <div class="stat-item">
          <span class="stat-num">6,072</span>
          <span class="stat-label">Sq Ft</span>
        </div>

        <!-- CREST SLOT — fixed width, crest rises above -->
        <div class="crest-slot">
          <img
            src="https://res.cloudinary.com/dghn2xpif/image/upload/gh_key/gh_crest_gloss_v2.png"
            alt="Garran Hill crest · 1916"
            class="crest">
        </div>

        <div class="stat-item">
          <span class="stat-num">4.15</span>
          <span class="stat-label">Acres</span>
        </div>

        <div class="stat-item">
          <span class="stat-num">7</span>
          <span class="stat-label">Fireplaces</span>
        </div>

        <div class="stat-item">
          <span class="stat-num">$4,250,000</span>
          <span class="stat-label">Offered At</span>
        </div>

      </div>

      <div class="rule-bottom"></div>

    </div><!-- /stat-bar -->

  </section>

</body>
</html>
