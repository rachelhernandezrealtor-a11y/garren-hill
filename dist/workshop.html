<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop — Rachel Hernandez Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; background: #0a0a0a; overflow: hidden; font-family: 'Cormorant Garamond', serif; color: #F5F0E8; }

  .shell { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  .topbar { height: 46px; background: #0d0d0d; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; }
  .topbar-title { font-family: 'Pinyon Script', cursive; font-size: 26px; color: #C9A96E; }
  .topbar-label { font-size: 9px; letter-spacing: 0.4em; color: #333; text-transform: uppercase; }
  .topbar-links { display: flex; gap: 16px; }
  .topbar-links a { font-size: 9px; letter-spacing: 0.3em; color: #C9A96E; text-transform: uppercase; text-decoration: none; opacity: 0.6; }
  .topbar-links a:hover { opacity: 1; }

  /* MAIN SPLIT — takes all remaining height */
  .split {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 46px);
  }

  /* LEFT CHAT PANEL */
  .panel-left {
    width: 420px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #1a1a1a;
    overflow: hidden;
    transition: width 0.3s, opacity 0.3s;
    flex-shrink: 0;
  }
  .panel-left.collapsed { width: 0; opacity: 0; pointer-events: none; }

  .panel-header {
    height: 36px;
    background: #0d0d0d;
    border-bottom: 1px solid #141414;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 10px;
    flex-shrink: 0;
  }
  .panel-header-label { font-size: 9px; letter-spacing: 0.35em; color: #333; text-transform: uppercase; }
  .panel-header-dot { width: 6px; height: 6px; border-radius: 50%; background: #C9A96E; opacity: 0.5; }
  .collapse-btn { margin-left: auto; background: transparent; border: 1px solid #1e1e1e; color: #555; font-family: 'Cormorant Garamond', serif; font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; padding: 3px 8px; cursor: pointer; }
  .collapse-btn:hover { border-color: #C9A96E; color: #C9A96E; }

  /* THE KEY FIX — iframe must be position absolute to fill parent */
  .chat-iframe-wrap {
    position: relative;
    flex: 1;
    overflow: hidden;
  }
  #chatFrame {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  /* DRAG */
  .drag-handle { width: 3px; background: #1a1a1a; cursor: col-resize; flex-shrink: 0; transition: background 0.2s; }
  .drag-handle:hover { background: #C9A96E; }

  /* RIGHT PANEL */
  .panel-right { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; min-width: 0; }

  /* CHAT TAB */
  .chat-tab { position: absolute; left: 0; top: 50%; transform: translateY(-50%); z-index: 20; background: #0d0d0d; border: 1px solid #2a2a2a; border-left: none; color: #C9A96E; font-family: 'Cormorant Garamond', serif; font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; padding: 14px 6px; cursor: pointer; writing-mode: vertical-rl; border-radius: 0 4px 4px 0; display: none; }
  .chat-tab.visible { display: block; }

  /* DEVICE SWITCHER */
  .device-switcher { display: flex; gap: 4px; margin-left: auto; }
  .dev-btn { background: transparent; border: 1px solid #1e1e1e; color: #555; font-family: 'Cormorant Garamond', serif; font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; padding: 4px 10px; cursor: pointer; transition: all 0.2s; }
  .dev-btn:hover { border-color: #C9A96E55; color: #C9A96E; }
  .dev-btn.active { border-color: #C9A96E; color: #C9A96E; background: #C9A96E11; }

  /* SITE PREVIEW */
  .preview-wrap { flex: 1; display: flex; overflow: auto; min-height: 0; }

  .preview-wrap.desktop { background: #0a0a0a; }
  .preview-wrap.desktop .device-chrome { width: 100%; display: flex; }
  .preview-wrap.desktop #siteFrame { width: 100%; height: 100%; }

  .preview-wrap.tablet { background: #111; align-items: flex-start; justify-content: center; padding: 20px 0; }
  .preview-wrap.tablet .device-chrome { width: 768px; border-radius: 14px; border: 2px solid #2a2a2a; box-shadow: 0 0 60px rgba(0,0,0,0.7); overflow: hidden; flex-shrink: 0; }
  .preview-wrap.tablet #siteFrame { width: 768px; height: calc(100vh - 120px); display: block; }

  .preview-wrap.mobile { background: #111; align-items: flex-start; justify-content: center; padding: 20px 0; }
  .preview-wrap.mobile .device-chrome { width: 390px; border-radius: 40px; border: 8px solid #2a2a2a; box-shadow: 0 0 80px rgba(0,0,0,0.9); overflow: hidden; position: relative; flex-shrink: 0; }
  .preview-wrap.mobile .device-chrome::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 110px; height: 28px; background: #2a2a2a; border-radius: 0 0 16px 16px; z-index: 10; }
  .preview-wrap.mobile #siteFrame { width: 390px; height: calc(100vh - 120px); display: block; }

  .device-chrome { display: flex; flex-direction: column; background: #0a0a0a; flex: 1; }
  #siteFrame { border: none; }

  .preview-controls { position: absolute; bottom: 14px; right: 14px; display: flex; gap: 8px; z-index: 5; }
  .ctrl-btn { background: rgba(10,10,10,0.92); border: 1px solid #2a2a2a; color: #C9A96E; font-family: 'Cormorant Garamond', serif; font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; padding: 8px 14px; cursor: pointer; }
  .ctrl-btn:hover { border-color: #C9A96E; }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="topbar-title">Rachel Hernandez Studio</div>
    <div class="topbar-label">Rocky + Rachel · Workshop</div>
    <div class="topbar-links">
      <a href="https://rachelhernandez.studio" target="_blank">↗ Live Site</a>
      <a href="https://app.base44.com/superagent/69e248a2469cc39540781cce" target="_blank">↗ Rocky Full</a>
    </div>
  </div>

  <div class="split" id="split">

    <!-- LEFT — CHAT -->
    <div class="panel-left" id="panelLeft">
      <div class="panel-header">
        <span class="panel-header-label">Rocky — AI</span>
        <div class="panel-header-dot"></div>
        <button class="collapse-btn" onclick="toggleChat()">← Hide</button>
      </div>
      <div class="chat-iframe-wrap">
        <iframe
          src="https://app.base44.com/superagent/69e248a2469cc39540781cce"
          title="Rocky Chat"
          allow="microphone"
          id="chatFrame"
        ></iframe>
      </div>
    </div>

    <div class="drag-handle" id="dragHandle"></div>

    <!-- RIGHT — SITE -->
    <div class="panel-right" id="panelRight">
      <button class="chat-tab" id="chatTab" onclick="toggleChat()">Rocky ›</button>

      <div class="panel-header">
        <span class="panel-header-label">Garran Hill — Live</span>
        <div class="device-switcher">
          <button class="dev-btn active" id="btn-desktop" onclick="setDevice('desktop')">Desktop</button>
          <button class="dev-btn" id="btn-tablet" onclick="setDevice('tablet')">Tablet</button>
          <button class="dev-btn" id="btn-mobile" onclick="setDevice('mobile')">Mobile</button>
        </div>
        <div class="panel-header-dot"></div>
      </div>

      <div class="preview-wrap desktop" id="previewWrap">
        <div class="device-chrome" id="deviceChrome">
          <iframe src="https://garren-hill.pages.dev" title="Garran Hill" id="siteFrame"></iframe>
        </div>
      </div>

      <div class="preview-controls">
        <button class="ctrl-btn" onclick="refreshSite()">↺ Refresh</button>
        <button class="ctrl-btn" onclick="window.open('https://garren-hill.pages.dev','_blank')">↗ Full</button>
      </div>
    </div>

  </div>
</div>

<script>
  let chatVisible = true;

  function toggleChat() {
    chatVisible = !chatVisible;
    document.getElementById('panelLeft').classList.toggle('collapsed', !chatVisible);
    document.getElementById('chatTab').classList.toggle('visible', !chatVisible);
    document.getElementById('dragHandle').style.display = chatVisible ? '' : 'none';
  }

  function setDevice(device) {
    document.getElementById('previewWrap').className = 'preview-wrap ' + device;
    document.querySelectorAll('.dev-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + device).classList.add('active');
    if ((device === 'mobile' || device === 'tablet') && chatVisible) toggleChat();
    if (device === 'desktop' && !chatVisible) toggleChat();
  }

  function refreshSite() {
    const f = document.getElementById('siteFrame');
    const s = f.src; f.src = ''; setTimeout(() => f.src = s, 50);
  }

  const handle = document.getElementById('dragHandle');
  const left = document.getElementById('panelLeft');
  const split = document.getElementById('split');
  let dragging = false;
  handle.addEventListener('mousedown', () => { dragging = true; document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none'; });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const r = split.getBoundingClientRect();
    let w = Math.max(300, Math.min(e.clientX - r.left, r.width - 300));
    left.style.width = w + 'px';
  });
  document.addEventListener('mouseup', () => { dragging = false; document.body.style.cursor = ''; document.body.style.userSelect = ''; });
</script>
</body>
</html>
