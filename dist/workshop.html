<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop — Rachel Hernandez Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    background: #0a0a0a;
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
    color: #F5F0E8;
  }

  .shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }

  /* TOP BAR */
  .topbar {
    height: 46px;
    background: #0d0d0d;
    border-bottom: 1px solid #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    flex-shrink: 0;
    z-index: 10;
  }
  .topbar-title {
    font-family: 'Pinyon Script', cursive;
    font-size: 26px;
    color: #C9A96E;
    letter-spacing: 0.02em;
  }

  /* PROJECT SWITCHER — center */
  .project-switcher {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .proj-btn {
    background: transparent;
    border: 1px solid #222;
    color: #444;
    font-family: 'Cormorant Garamond', serif;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding: 6px 18px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .proj-btn:hover { border-color: rgba(201,169,110,0.4); color: #C9A96E; }
  .proj-btn.active { border-color: #C9A96E; color: #C9A96E; background: rgba(201,169,110,0.05); }

  .topbar-links {
    display: flex;
    gap: 20px;
  }
  .topbar-links a {
    font-size: 9px;
    letter-spacing: 0.35em;
    color: #C9A96E;
    text-transform: uppercase;
    text-decoration: none;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .topbar-links a:hover { opacity: 1; }

  /* SPLIT */
  .split {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* PANELS */
  .panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .panel-left {
    width: 42%;
    min-width: 340px;
    border-right: 1px solid #1a1a1a;
  }

  .panel-right {
    flex: 1;
  }

  .panel-header {
    height: 34px;
    background: #0d0d0d;
    border-bottom: 1px solid #141414;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    flex-shrink: 0;
  }
  .panel-header-label {
    font-size: 9px;
    letter-spacing: 0.35em;
    color: #333;
    text-transform: uppercase;
  }
  .panel-header-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #C9A96E;
    opacity: 0.5;
    animation: pulse 2.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:0.15} }

  iframe {
    flex: 1;
    border: none;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
  }

  /* DIVIDER DRAG HANDLE */
  .drag-handle {
    width: 3px;
    background: #1a1a1a;
    cursor: col-resize;
    flex-shrink: 0;
    position: relative;
    transition: background 0.2s;
  }
  .drag-handle:hover { background: #C9A96E; }
  .drag-handle::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1px;
    height: 40px;
    background: #C9A96E;
    opacity: 0.4;
    border-radius: 1px;
  }

  /* PREVIEW CONTROLS */
  .preview-controls {
    position: absolute;
    bottom: 16px;
    right: 16px;
    display: flex;
    gap: 8px;
    z-index: 5;
  }
  .ctrl-btn {
    background: rgba(10,10,10,0.85);
    border: 1px solid #2a2a2a;
    color: #C9A96E;
    font-family: 'Cormorant Garamond', serif;
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding: 8px 14px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .ctrl-btn:hover { border-color: #C9A96E; }
</style>
</head>
<body>

<div class="shell">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-title">Rachel Hernandez Studio</div>

    <!-- PROJECT SWITCHER -->
    <div class="project-switcher">
      <button class="proj-btn active" onclick="switchProject('gh', this)">Garran Hill</button>
      <button class="proj-btn" onclick="switchProject('ff', this)">Flow Farm</button>
    </div>

    <div class="topbar-links">
      <a href="https://rachelhernandez.studio" target="_blank">↗ Studio</a>
      <a href="https://app.base44.com/superagent/69e248a2469cc39540781cce" target="_blank">↗ Rocky Full</a>
    </div>
  </div>

  <!-- SPLIT PANELS -->
  <div class="split" id="split">

    <!-- LEFT — ROCKY CHAT -->
    <div class="panel panel-left" id="panelLeft">
      <div class="panel-header">
        <span class="panel-header-label">Rocky — AI</span>
        <div class="panel-header-dot"></div>
      </div>
      <iframe
        src="https://app.base44.com/superagent/69e248a2469cc39540781cce"
        title="Rocky Chat"
        allow="microphone"
        id="chatFrame"
      ></iframe>
    </div>

    <!-- DRAG HANDLE -->
    <div class="drag-handle" id="dragHandle"></div>

    <!-- RIGHT — LIVE SITE -->
    <div class="panel panel-right" id="panelRight">
      <div class="panel-header">
        <span class="panel-header-label" id="site-label">Garran Hill — Live</span>
        <div class="panel-header-dot"></div>
      </div>
      <iframe
        src="https://garren-hill.pages.dev"
        title="Site Preview"
        id="siteFrame"
      ></iframe>

      <div class="preview-controls">
        <button class="ctrl-btn" onclick="document.getElementById('siteFrame').src = document.getElementById('siteFrame').src">↺ Refresh</button>
        <button class="ctrl-btn" id="fullscreen-btn" onclick="window.open('https://garren-hill.pages.dev','_blank')">↗ Full Screen</button>
      </div>
    </div>

  </div>
</div>

<script>
  const projects = {
    gh: { url: 'https://garren-hill.pages.dev', label: 'Garran Hill — Live' },
    ff: { url: 'https://flowfarm-landing.pages.dev', label: 'Flow Farm — Live' }
  };

  function switchProject(key, btn) {
    document.querySelectorAll('.proj-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const p = projects[key];
    document.getElementById('siteFrame').src = p.url;
    document.getElementById('site-label').textContent = p.label;
    document.getElementById('fullscreen-btn').onclick = () => window.open(p.url, '_blank');
  }

  // Draggable divider
  const handle = document.getElementById('dragHandle');
  const left = document.getElementById('panelLeft');
  const split = document.getElementById('split');
  let dragging = false;

  handle.addEventListener('mousedown', e => {
    dragging = true;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const splitRect = split.getBoundingClientRect();
    let newWidth = e.clientX - splitRect.left;
    newWidth = Math.max(280, Math.min(newWidth, splitRect.width - 280));
    left.style.width = newWidth + 'px';
    left.style.minWidth = newWidth + 'px';
  });

  document.addEventListener('mouseup', () => {
    dragging = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
</script>

</body>
</html>
