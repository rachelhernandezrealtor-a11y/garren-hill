<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop — Rachel Hernandez Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; background: #0a0a0a; overflow: hidden; font-family: 'Cormorant Garamond', serif; color: #F5F0E8; }

  .shell { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  /* TOP BAR */
  .topbar {
    height: 46px; background: #0d0d0d; border-bottom: 1px solid #1a1a1a;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; flex-shrink: 0; gap: 20px;
  }
  .topbar-title { font-family: 'Pinyon Script', cursive; font-size: 26px; color: #C9A96E; white-space: nowrap; }

  /* PROJECT SWITCHER */
  .project-switcher {
    display: flex; align-items: center; gap: 6px; flex: 1; justify-content: center;
  }
  .project-btn {
    background: transparent; border: 1px solid #222;
    color: #666; font-family: 'Cormorant Garamond', serif;
    font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
    padding: 6px 16px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .project-btn:hover { border-color: #C9A96E44; color: #C9A96E; }
  .project-btn.active { border-color: #C9A96E; color: #C9A96E; background: #C9A96E0a; }
  .project-divider { font-size: 9px; color: #222; }

  /* SPLIT */
  .split { display: flex; flex: 1; overflow: hidden; }

  /* DRAG HANDLE */
  .drag-handle { width: 3px; background: #1a1a1a; cursor: col-resize; flex-shrink: 0; transition: background 0.2s; }
  .drag-handle:hover { background: #C9A96E; }

  /* LEFT — ROCKY CHAT (iframe) */
  .panel-left {
    width: 42%; min-width: 300px;
    display: flex; flex-direction: column; overflow: hidden;
    border-right: 1px solid #1a1a1a;
  }
  .panel-header {
    height: 34px; background: #0d0d0d; border-bottom: 1px solid #141414;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; flex-shrink: 0;
  }
  .panel-header-label { font-size: 9px; letter-spacing: 0.35em; color: #333; text-transform: uppercase; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #C9A96E; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .panel-left iframe { flex: 1; border: none; width: 100%; height: 100%; }

  /* RIGHT — SITE PREVIEW */
  .panel-right { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }

  .preview-header {
    height: 34px; background: #0d0d0d; border-bottom: 1px solid #141414;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; flex-shrink: 0;
  }
  .preview-property-name { font-size: 9px; letter-spacing: 0.35em; color: #C9A96E; text-transform: uppercase; }
  .preview-url { font-size: 8px; letter-spacing: 0.2em; color: #333; }

  .panel-right iframe { flex: 1; border: none; width: 100%; height: 100%; background: #0a0a0a; }

  .preview-controls {
    position: absolute; bottom: 16px; right: 16px;
    display: flex; gap: 8px; z-index: 5;
  }
  .ctrl-btn {
    background: rgba(10,10,10,0.9); border: 1px solid #2a2a2a; color: #C9A96E;
    font-family: 'Cormorant Garamond', serif; font-size: 9px; letter-spacing: 0.3em;
    text-transform: uppercase; padding: 8px 14px; cursor: pointer; transition: border-color 0.2s;
  }
  .ctrl-btn:hover { border-color: #C9A96E; }

  /* SWITCH OVERLAY */
  .switch-overlay {
    position: absolute; inset: 0; background: #0a0a0a;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .switch-overlay.visible { opacity: 1; pointer-events: all; }
  .switch-overlay-name { font-family: 'Pinyon Script', cursive; font-size: 36px; color: #C9A96E; }
  .switch-overlay-sub { font-size: 10px; letter-spacing: 0.4em; color: #444; text-transform: uppercase; }

  /* NEW PROJECT PANEL */
  .new-project-panel {
    display: none; flex: 1; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px; padding: 40px;
  }
  .new-project-panel.visible { display: flex; }
  .new-project-panel p { font-size: 13px; font-weight: 300; color: #666; letter-spacing: 0.1em; text-align: center; line-height: 1.8; }
  .new-project-panel .np-label { font-size: 9px; letter-spacing: 0.4em; color: #C9A96E; text-transform: uppercase; }
</style>
</head>
<body>
<div class="shell">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-title">Rachel Hernandez Studio</div>

    <div class="project-switcher">
      <button class="project-btn" id="btn-gh" onclick="switchProject('gh')">Garran Hill</button>
      <div class="project-divider">·</div>
      <button class="project-btn active" id="btn-ff" onclick="switchProject('ff')">Flow Farm</button>
      <div class="project-divider">·</div>
      <button class="project-btn" id="btn-new" onclick="switchProject('new')" style="border-style:dashed;">+ New Project</button>
    </div>

    <div style="width:120px"></div><!-- spacer to balance -->
  </div>

  <div class="split" id="split">

    <!-- LEFT — ROCKY CHAT -->
    <div class="panel-left" id="panelLeft">
      <div class="panel-header">
        <span class="panel-header-label">Rocky — AI</span>
        <div class="status-dot"></div>
      </div>
      <iframe
        src="https://app.base44.com/superagent/69e248a2469cc39540781cce"
        title="Rocky Chat"
        allow="clipboard-write"
      ></iframe>
    </div>

    <!-- DRAG HANDLE -->
    <div class="drag-handle" id="dragHandle"></div>

    <!-- RIGHT — PREVIEW -->
    <div class="panel-right" id="panelRight">
      <div class="preview-header">
        <span class="preview-property-name" id="previewName">Flow Farm</span>
        <span class="preview-url" id="previewUrl">flowfarm-landing.pages.dev</span>
      </div>

      <!-- SWITCH OVERLAY -->
      <div class="switch-overlay" id="switchOverlay">
        <div class="switch-overlay-name" id="overlayName">Flow Farm</div>
        <div class="switch-overlay-sub">Loading preview...</div>
      </div>

      <iframe
        src="https://flowfarm-landing.pages.dev"
        title="Site Preview"
        id="siteFrame"
      ></iframe>

      <!-- NEW PROJECT PANEL -->
      <div class="new-project-panel" id="newProjectPanel">
        <div class="np-label">New Project</div>
        <p>Tell Rocky the property name,<br>address, and price.<br><br>Rocky will build the site brief<br>and start the build.</p>
      </div>

      <div class="preview-controls" id="previewControls">
        <button class="ctrl-btn" onclick="refreshFrame()">↺ Refresh</button>
        <button class="ctrl-btn" onclick="openFull()">↗ Full Screen</button>
      </div>
    </div>

  </div>
</div>

<script>
  let currentProject = 'ff';

  const PROJECTS = {
    gh: {
      name: 'Garran Hill',
      url: 'https://garren-hill.pages.dev',
      displayUrl: 'garren-hill.pages.dev',
      btnId: 'btn-gh'
    },
    ff: {
      name: 'Flow Farm',
      url: 'https://flowfarm-landing.pages.dev',
      displayUrl: 'flowfarm-landing.pages.dev',
      btnId: 'btn-ff'
    },
    new: {
      name: 'New Project',
      url: null,
      displayUrl: '— not yet built —',
      btnId: 'btn-new'
    }
  };

  function switchProject(key) {
    if (key === currentProject) return;
    currentProject = key;
    const proj = PROJECTS[key];

    // Update buttons
    document.querySelectorAll('.project-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(proj.btnId).classList.add('active');

    // Update header
    document.getElementById('previewName').textContent = proj.name;
    document.getElementById('previewUrl').textContent = proj.displayUrl;

    const frame = document.getElementById('siteFrame');
    const newPanel = document.getElementById('newProjectPanel');
    const controls = document.getElementById('previewControls');

    if (key === 'new') {
      frame.style.display = 'none';
      newPanel.classList.add('visible');
      controls.style.display = 'none';
    } else {
      newPanel.classList.remove('visible');
      frame.style.display = 'block';
      controls.style.display = 'flex';

      // Show overlay while loading
      const overlay = document.getElementById('switchOverlay');
      document.getElementById('overlayName').textContent = proj.name;
      overlay.classList.add('visible');

      frame.src = proj.url + '?' + Date.now();
      frame.onload = () => setTimeout(() => overlay.classList.remove('visible'), 200);
    }
  }

  function refreshFrame() {
    const proj = PROJECTS[currentProject];
    if (proj.url) document.getElementById('siteFrame').src = proj.url + '?' + Date.now();
  }

  function openFull() {
    const proj = PROJECTS[currentProject];
    if (proj.url) window.open(proj.url, '_blank');
  }

  // DRAG RESIZE
  const dragHandle = document.getElementById('dragHandle');
  const panelLeft = document.getElementById('panelLeft');
  const split = document.getElementById('split');
  let dragging = false;

  dragHandle.addEventListener('mousedown', e => { dragging = true; e.preventDefault(); });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const rect = split.getBoundingClientRect();
    const newW = Math.min(Math.max(e.clientX - rect.left, 280), rect.width - 280);
    panelLeft.style.width = newW + 'px';
  });
  document.addEventListener('mouseup', () => { dragging = false; });
</script>
</body>
</html>
