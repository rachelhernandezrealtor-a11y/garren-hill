<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop — Rachel Hernandez Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; background: #0a0a0a; overflow: hidden; font-family: 'Cormorant Garamond', serif; color: #F5F0E8; }

  .shell { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  /* TOP BAR */
  .topbar {
    height: 46px; background: #0d0d0d; border-bottom: 1px solid #1a1a1a;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; flex-shrink: 0;
  }
  .topbar-title { font-family: 'Pinyon Script', cursive; font-size: 26px; color: #C9A96E; }
  .topbar-label { font-size: 9px; letter-spacing: 0.45em; color: #333; text-transform: uppercase; }
  .topbar-links { display: flex; gap: 20px; }
  .topbar-links a { font-size: 9px; letter-spacing: 0.35em; color: #C9A96E; text-transform: uppercase; text-decoration: none; opacity: 0.7; transition: opacity 0.2s; }
  .topbar-links a:hover { opacity: 1; }

  /* SPLIT */
  .split { display: flex; flex: 1; overflow: hidden; }

  /* DRAG HANDLE */
  .drag-handle { width: 3px; background: #1a1a1a; cursor: col-resize; flex-shrink: 0; position: relative; transition: background 0.2s; }
  .drag-handle:hover { background: #C9A96E; }

  /* LEFT — CHAT */
  .panel-left {
    width: 42%; min-width: 320px;
    display: flex; flex-direction: column; overflow: hidden;
    border-right: 1px solid #1a1a1a;
  }
  .panel-header {
    height: 34px; background: #0d0d0d; border-bottom: 1px solid #141414;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; flex-shrink: 0;
  }
  .panel-header-label { font-size: 9px; letter-spacing: 0.35em; color: #333; text-transform: uppercase; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #C9A96E; opacity: 0.5; }
  .status-dot.live { opacity: 1; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* MESSAGES */
  .messages {
    flex: 1; overflow-y: auto; padding: 20px 16px;
    display: flex; flex-direction: column; gap: 16px;
    scrollbar-width: thin; scrollbar-color: #1a1a1a #0a0a0a;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: #0a0a0a; }
  .messages::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 2px; }

  .msg { display: flex; flex-direction: column; gap: 4px; max-width: 88%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.rocky { align-self: flex-start; align-items: flex-start; }

  .msg-label { font-size: 8px; letter-spacing: 0.3em; color: #333; text-transform: uppercase; padding: 0 4px; }

  .msg-bubble {
    padding: 10px 14px; font-size: 14px; font-weight: 300; line-height: 1.6;
    border: 1px solid #1a1a1a;
  }
  .msg.user .msg-bubble { background: #0f0f0f; border-color: #C9A96E22; color: #F5F0E8; }
  .msg.rocky .msg-bubble { background: #111; border-color: #1a1a1a; color: #e0d8cc; }

  .typing { display: flex; align-items: center; gap: 4px; padding: 10px 14px; border: 1px solid #1a1a1a; background: #111; }
  .typing span { width: 4px; height: 4px; border-radius: 50%; background: #C9A96E; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

  /* INPUT */
  .input-area {
    border-top: 1px solid #1a1a1a; padding: 12px 16px;
    display: flex; gap: 10px; align-items: flex-end;
    background: #0d0d0d;
  }
  textarea {
    flex: 1; background: #111; border: 1px solid #1e1e1e; color: #F5F0E8;
    font-family: 'Cormorant Garamond', serif; font-size: 14px; font-weight: 300;
    padding: 10px 12px; resize: none; outline: none; line-height: 1.5;
    min-height: 42px; max-height: 120px;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: #C9A96E44; }
  textarea::placeholder { color: #333; }

  .send-btn {
    background: transparent; border: 1px solid #C9A96E44; color: #C9A96E;
    font-family: 'Cormorant Garamond', serif; font-size: 11px; letter-spacing: 0.3em;
    text-transform: uppercase; padding: 10px 16px; cursor: pointer;
    transition: all 0.2s; white-space: nowrap; height: 42px;
  }
  .send-btn:hover { background: #C9A96E11; border-color: #C9A96E; }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* RIGHT — SITE PREVIEW */
  .panel-right { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .panel-right iframe { flex: 1; border: none; width: 100%; height: 100%; background: #0a0a0a; }

  .preview-controls {
    position: absolute; bottom: 16px; right: 16px;
    display: flex; gap: 8px; z-index: 5;
  }
  .ctrl-btn {
    background: rgba(10,10,10,0.9); border: 1px solid #2a2a2a; color: #C9A96E;
    font-family: 'Cormorant Garamond', serif; font-size: 9px; letter-spacing: 0.3em;
    text-transform: uppercase; padding: 8px 14px; cursor: pointer; transition: border-color 0.2s;
  }
  .ctrl-btn:hover { border-color: #C9A96E; }
</style>
</head>
<body>
<div class="shell">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-title">Rachel Hernandez Studio</div>
    <div class="topbar-label">Rocky + Rachel · Workshop</div>
    <div class="topbar-links">
      <a href="https://rachelhernandez.studio" target="_blank">↗ Live Site</a>
      <a href="https://app.base44.com/superagent/69e248a2469cc39540781cce" target="_blank">↗ Rocky Full</a>
    </div>
  </div>

  <div class="split" id="split">

    <!-- LEFT — CHAT -->
    <div class="panel-left" id="panelLeft">
      <div class="panel-header">
        <span class="panel-header-label">Rocky — AI</span>
        <div class="status-dot live" id="statusDot"></div>
      </div>

      <div class="messages" id="messages">
        <div class="msg rocky">
          <div class="msg-label">Rocky</div>
          <div class="msg-bubble">Workshop is live. 🖤<br><br>Rocky on the left. Garran Hill on the right. Tell me what to change — I'll push it live and you hit refresh.</div>
        </div>
      </div>

      <div class="input-area">
        <textarea id="msgInput" placeholder="Tell Rocky what to change..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>

    <!-- DRAG HANDLE -->
    <div class="drag-handle" id="dragHandle"></div>

    <!-- RIGHT — SITE -->
    <div class="panel-right" id="panelRight">
      <div class="panel-header">
        <span class="panel-header-label">Garran Hill — Live</span>
        <div class="status-dot"></div>
      </div>
      <iframe src="https://garren-hill.pages.dev" title="Garran Hill" id="siteFrame"></iframe>
      <div class="preview-controls">
        <button class="ctrl-btn" onclick="document.getElementById('siteFrame').src = 'https://garren-hill.pages.dev?' + Date.now()">↺ Refresh</button>
        <button class="ctrl-btn" onclick="window.open('https://garren-hill.pages.dev','_blank')">↗ Full Screen</button>
      </div>
    </div>

  </div>
</div>

<script>
  const API_URL = "https://app.base44.com/api/apps/69e248a2469cc39540781cce/ai/chat";
  const APP_ID = "69e248a2469cc39540781cce";
  let sessionId = null;
  let isLoading = false;

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function addMessage(role, text) {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="msg-label">${role === 'user' ? 'Rachel' : 'Rocky'}</div>
      <div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>
    `;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function showTyping() {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg rocky';
    div.id = 'typing-indicator';
    div.innerHTML = `<div class="msg-label">Rocky</div><div class="typing"><span></span><span></span><span></span></div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const btn = document.getElementById('sendBtn');
    const text = input.value.trim();
    if (!text || isLoading) return;

    isLoading = true;
    btn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    addMessage('user', text);
    showTyping();

    try {
      const body = { message: text };
      if (sessionId) body.session_id = sessionId;

      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        credentials: 'include'
      });

      const data = await res.json();
      hideTyping();

      if (data.session_id) sessionId = data.session_id;

      const reply = data.message || data.response || data.content || "Got it — on it.";
      addMessage('rocky', reply);

    } catch (err) {
      hideTyping();
      addMessage('rocky', 'Connection dropped. Try sending again — or open Rocky Full (top right) to continue.');
    }

    isLoading = false;
    btn.disabled = false;
    input.focus();
  }

  // Draggable divider
  const handle = document.getElementById('dragHandle');
  const left = document.getElementById('panelLeft');
  const split = document.getElementById('split');
  let dragging = false;

  handle.addEventListener('mousedown', () => {
    dragging = true;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const rect = split.getBoundingClientRect();
    let w = e.clientX - rect.left;
    w = Math.max(280, Math.min(w, rect.width - 280));
    left.style.width = w + 'px';
    left.style.minWidth = w + 'px';
  });
  document.addEventListener('mouseup', () => {
    dragging = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });

  // Focus input on load
  document.getElementById('msgInput').focus();
</script>
</body>
</html>
