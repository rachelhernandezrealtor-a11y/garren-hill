<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop — Rachel Hernandez Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,200;0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; background: #0a0a0a; overflow: hidden; font-family: 'Cormorant Garamond', serif; color: #F5F0E8; }

  .shell { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  /* TOP BAR */
  .topbar {
    height: 50px; background: #0d0d0d; border-bottom: 1px solid #1a1a1a;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; flex-shrink: 0; gap: 16px;
  }
  .topbar-title {
    font-family: 'Pinyon Script', cursive; font-size: 26px; color: #C9A96E; white-space: nowrap;
  }
  .project-switcher {
    display: flex; align-items: center; gap: 6px; flex: 1; justify-content: center;
  }
  .project-btn {
    background: transparent; border: 1px solid #222;
    color: #555; font-family: 'Cormorant Garamond', serif;
    font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
    padding: 6px 18px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .project-btn:hover { border-color: rgba(201,169,110,0.4); color: #C9A96E; }
  .project-btn.active { border-color: #C9A96E; color: #C9A96E; background: rgba(201,169,110,0.05); }

  /* ROCKY PANEL (left) */
  .rocky-panel {
    width: 380px; min-width: 320px; max-width: 420px;
    display: flex; flex-direction: column;
    background: #0d0d0d; border-right: 1px solid #1a1a1a;
    flex-shrink: 0;
  }
  .panel-header {
    height: 36px; background: #0d0d0d; border-bottom: 1px solid #141414;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; flex-shrink: 0;
  }
  .panel-label { font-size: 9px; letter-spacing: 0.35em; color: #333; text-transform: uppercase; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #C9A96E; animation: pulse 2.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

  /* ROCKY CARD CONTENT */
  .rocky-content {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 32px 28px;
  }
  .rocky-seal {
    width: 80px; height: 80px; object-fit: contain; opacity: 0.7;
  }
  .rocky-name {
    font-family: 'Pinyon Script', cursive; font-size: 42px; color: #C9A96E;
    text-align: center; line-height: 1;
  }
  .rocky-tagline {
    font-size: 11px; letter-spacing: 0.3em; color: #444; text-transform: uppercase;
    text-align: center; line-height: 1.8;
  }
  .rocky-divider { width: 40px; height: 1px; background: rgba(201,169,110,0.3); }

  .open-chat-btn {
    display: inline-flex; align-items: center; gap: 10px;
    background: transparent; border: 1px solid #C9A96E;
    color: #C9A96E; font-family: 'Cormorant Garamond', serif;
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    padding: 12px 28px; cursor: pointer; text-decoration: none;
    transition: all 0.25s;
  }
  .open-chat-btn:hover { background: rgba(201,169,110,0.08); }
  .open-chat-btn svg { flex-shrink: 0; }

  .shortcut-hint {
    font-size: 10px; letter-spacing: 0.2em; color: #2a2a2a; text-transform: uppercase;
    text-align: center;
  }

  /* QUICK NOTES */
  .notes-area {
    border-top: 1px solid #141414; padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .notes-label { font-size: 9px; letter-spacing: 0.3em; color: #2a2a2a; text-transform: uppercase; }
  .notes-input {
    background: #111; border: 1px solid #1e1e1e; color: #666;
    font-family: 'Cormorant Garamond', serif; font-size: 13px; line-height: 1.6;
    padding: 10px 12px; resize: none; outline: none; height: 90px;
    width: 100%; transition: border-color 0.2s;
  }
  .notes-input:focus { border-color: rgba(201,169,110,0.3); color: #F5F0E8; }
  .notes-input::placeholder { color: #2a2a2a; }

  /* SITE PREVIEW (right) */
  .split { display: flex; flex: 1; overflow: hidden; }
  .preview-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .preview-header {
    height: 36px; background: #0d0d0d; border-bottom: 1px solid #141414;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; flex-shrink: 0; gap: 12px;
  }
  .preview-url {
    font-size: 10px; letter-spacing: 0.15em; color: #333;
    font-family: 'Cormorant Garamond', serif; flex: 1;
  }
  .preview-actions { display: flex; gap: 8px; }
  .preview-btn {
    background: transparent; border: 1px solid #222; color: #444;
    font-family: 'Cormorant Garamond', serif; font-size: 9px;
    letter-spacing: 0.25em; text-transform: uppercase; padding: 4px 12px;
    cursor: pointer; transition: all 0.2s; text-decoration: none;
    display: inline-flex; align-items: center;
  }
  .preview-btn:hover { border-color: rgba(201,169,110,0.4); color: #C9A96E; }
  .preview-panel iframe {
    flex: 1; border: none; width: 100%; height: 100%;
  }

  /* DRAG HANDLE */
  .drag-handle { width: 3px; background: #1a1a1a; cursor: col-resize; flex-shrink: 0; transition: background 0.15s; }
  .drag-handle:hover, .drag-handle.dragging { background: #C9A96E; }
</style>
</head>
<body>
<div class="shell">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-title">Rachel Hernandez Studio</div>
    <div class="project-switcher">
      <button class="project-btn active" onclick="switchProject('gh')">Garran Hill</button>
      <button class="project-btn" onclick="switchProject('ff')">Flow Farm</button>
      <button class="project-btn" onclick="switchProject('new')">+ New Project</button>
    </div>
    <a href="https://app.base44.com/superagent/69e248a2469cc39540781cce" target="_blank"
       style="font-size:9px;letter-spacing:0.3em;color:#333;text-decoration:none;text-transform:uppercase;transition:color 0.2s;"
       onmouseover="this.style.color='#C9A96E'" onmouseout="this.style.color='#333'">Open Rocky ↗</a>
  </div>

  <!-- MAIN SPLIT -->
  <div class="split">

    <!-- LEFT — ROCKY PANEL -->
    <div class="rocky-panel" id="rocky-panel">
      <div class="panel-header">
        <span class="panel-label">Rocky</span>
        <div class="status-dot"></div>
      </div>

      <div class="rocky-content">
        <img class="rocky-seal"
          src="https://res.cloudinary.com/dghn2xpif/image/upload/v1777397863/gh_key/gh_wax_seal_v3.png"
          alt="Studio seal">
        <div class="rocky-name">Rocky</div>
        <div class="rocky-divider"></div>
        <div class="rocky-tagline">Your agent is standing by.<br>Open the chat to continue.</div>
        <a class="open-chat-btn"
           href="https://app.base44.com/superagent/69e248a2469cc39540781cce"
           target="_blank">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9A96E" stroke-width="1.5">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          Open Chat
        </a>
        <div class="shortcut-hint">Opens in new tab · Keep this window for preview</div>
      </div>

      <div class="notes-area">
        <div class="notes-label">Session Notes</div>
        <textarea class="notes-input" placeholder="Drop notes here as you work..."></textarea>
      </div>
    </div>

    <!-- DRAG HANDLE -->
    <div class="drag-handle" id="drag-handle"></div>

    <!-- RIGHT — SITE PREVIEW -->
    <div class="preview-panel">
      <div class="preview-header">
        <span class="preview-url" id="preview-url">garren-hill.pages.dev</span>
        <div class="preview-actions">
          <button class="preview-btn" onclick="reloadPreview()">Refresh</button>
          <a class="preview-btn" id="fullscreen-link" href="https://garren-hill.pages.dev" target="_blank">Full Screen ↗</a>
        </div>
      </div>
      <iframe id="site-preview" src="https://garren-hill.pages.dev" title="Site Preview"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock allow-top-navigation"></iframe>
    </div>

  </div>
</div>

<script>
  const projects = {
    gh: { url: 'https://garren-hill.pages.dev', label: 'garren-hill.pages.dev' },
    ff: { url: 'https://flowfarm-landing.pages.dev', label: 'flowfarm-landing.pages.dev' },
    new: { url: 'about:blank', label: 'New Project' }
  };

  function switchProject(key) {
    document.querySelectorAll('.project-btn').forEach((b,i) => {
      b.classList.toggle('active', ['gh','ff','new'][i] === key);
    });
    const p = projects[key];
    document.getElementById('site-preview').src = p.url;
    document.getElementById('preview-url').textContent = p.label;
    document.getElementById('fullscreen-link').href = p.url;
  }

  function reloadPreview() {
    const f = document.getElementById('site-preview');
    f.src = f.src;
  }

  // Drag to resize
  const handle = document.getElementById('drag-handle');
  const leftPanel = document.getElementById('rocky-panel');
  let dragging = false, startX = 0, startW = 0;

  handle.addEventListener('mousedown', e => {
    dragging = true; startX = e.clientX; startW = leftPanel.offsetWidth;
    handle.classList.add('dragging'); e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const newW = Math.max(280, Math.min(600, startW + (e.clientX - startX)));
    leftPanel.style.width = newW + 'px';
  });
  document.addEventListener('mouseup', () => {
    dragging = false; handle.classList.remove('dragging');
  });

  // Persist notes in localStorage
  const notesEl = document.querySelector('.notes-input');
  notesEl.value = localStorage.getItem('workshop_notes') || '';
  notesEl.addEventListener('input', () => localStorage.setItem('workshop_notes', notesEl.value));
</script>
</body>
</html>
