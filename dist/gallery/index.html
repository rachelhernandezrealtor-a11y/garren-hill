<style>
:root{
  --ink:#0a0a0a; --gold:#b89863; --gold-soft:rgba(184,152,99,.5); --gold-hi:#ccb28a;
  --cream:#F5F0E8; --cream-dim:rgba(245,240,232,.88); --whisper:rgba(245,240,232,.42);
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'Cormorant Garamond',Georgia,serif;
  --font-label:'Instrument Sans',system-ui,sans-serif;
  --font-chapter:'Cinzel',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--cream);font-family:var(--font-body);font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

/* ===== TOP BAR ===== */
.gbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:1.1rem clamp(1.2rem,4vw,3rem);background:linear-gradient(180deg,rgba(10,10,10,.94),rgba(10,10,10,.72) 70%,transparent);
  backdrop-filter:blur(6px)}
.gbar .home{font-family:var(--font-label);font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--cream);display:flex;align-items:center;gap:.6rem}
.gbar .home::before{content:"\2190";color:var(--gold);font-size:.9rem}
.gbar .est{font-family:var(--font-chapter);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cream-dim)}
.gbar .est b{font-weight:500;color:var(--cream)}
.gbar .count{font-family:var(--font-label);font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;color:var(--whisper)}

/* ===== HEADER ===== */
.ghead{text-align:center;padding:clamp(2.4rem,6vh,4.5rem) 1.5rem clamp(1.4rem,3vh,2.2rem)}
.ghead .eyebrow{font-family:var(--font-label);font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);
  text-shadow:0 1px 12px rgba(8,8,7,.6)}
.ghead h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2.1rem,5vw,3.6rem);color:var(--cream);margin:.5rem 0 .7rem;line-height:1.05}
.ghead p{font-family:var(--font-body);font-style:italic;font-size:clamp(1.05rem,1.6vw,1.3rem);color:var(--cream-dim);max-width:46ch;margin:0 auto}

/* ===== ROOM JUMP CHIPS ===== */
.gchips{position:sticky;top:60px;z-index:20;display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;
  padding:1rem clamp(1rem,4vw,3rem) 1.6rem;background:linear-gradient(180deg,rgba(10,10,10,.92),transparent)}
.chip{font-family:var(--font-label);font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--cream-dim);
  background:transparent;border:1px solid var(--gold-soft);border-radius:1px;padding:.5rem 1.05rem;cursor:pointer;
  transition:all .4s ease;white-space:nowrap}
.chip:hover{color:var(--cream);border-color:var(--gold)}
.chip.on{color:var(--ink);background:var(--gold);border-color:var(--gold)}

/* ===== GROUPS ===== */
.group{padding:clamp(1.6rem,4vh,3rem) clamp(1rem,4vw,3.2rem)}
.group-title{display:flex;align-items:center;gap:1.1rem;margin:0 auto clamp(1.2rem,3vh,2rem);max-width:1500px}
.group-title .gt-name{font-family:var(--font-chapter);font-size:.9rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.group-title .gt-rule{height:1px;flex:1;background:linear-gradient(90deg,var(--gold-soft),transparent)}
.group-title .gt-n{font-family:var(--font-label);font-size:.66rem;letter-spacing:.2em;color:var(--whisper)}

/* ===== PHOTO ROWS — full-frame, NEVER cropped (Photo Law).
   Each photo keeps its real aspect ratio; rows balance widths. ===== */
.gset{display:flex;flex-wrap:wrap;gap:clamp(.5rem,1vw,1rem);max-width:1500px;margin:0 auto;justify-content:center}
.gcell{position:relative;cursor:pointer;overflow:hidden;background:#141413;
  flex-grow:1;flex-basis:380px;max-width:780px}
.gcell.portrait{flex-basis:300px;max-width:520px}
/* the frame: photo sits FULL (contain). A blurred copy fills the void instead of dead black bars. */
.gframe{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden}
.gcell.portrait .gframe{aspect-ratio:3/4}
.gblur{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(30px) brightness(.55) saturate(1.1)}
.gframe,.gcell{overflow:hidden}
.gphoto{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;
  transition:transform 1.2s cubic-bezier(.16,1,.3,1),opacity .8s ease;opacity:0}
.gphoto.loaded{opacity:1}
.gcell:hover .gphoto{transform:scale(1.02)}
.gcell::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border:1px solid transparent;transition:border-color .5s ease,inset .5s ease}
.gcell:hover::after{border-color:rgba(204,178,138,.42);inset:7px}
.gcap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:1.4rem 1.1rem .9rem;
  background:linear-gradient(0deg,rgba(8,8,7,.82),transparent);
  font-family:var(--font-label);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cream);
  opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .5s ease}
.gcell:hover .gcap{opacity:1;transform:none}

/* ===== LIGHTBOX ===== */
#lb{position:fixed;inset:0;z-index:100;background:rgba(8,8,7,.97);display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb .lb-blur{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(60px) brightness(.6) saturate(1.35);transform:scale(1.25);opacity:.9}
#lb .lb-stage{position:relative;z-index:2;width:92vw;height:84vh;display:flex;align-items:center;justify-content:center}
#lb img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 30px 90px rgba(0,0,0,.7)}
#lb .lb-cap{position:absolute;bottom:2.2rem;left:0;right:0;z-index:3;text-align:center;
  font-family:var(--font-label);font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;color:var(--cream)}
#lb .lb-cap .lb-room{color:var(--gold);margin-left:.9rem}
#lb .lb-counter{position:absolute;top:1.6rem;left:0;right:0;z-index:3;text-align:center;font-family:var(--font-label);font-size:.68rem;letter-spacing:.24em;color:var(--whisper)}
#lb .lb-x{position:absolute;top:1.3rem;right:1.6rem;z-index:4;width:42px;height:42px;border:1px solid var(--gold-soft);border-radius:50%;background:transparent;color:var(--cream);font-size:1.1rem;cursor:pointer;transition:all .3s}
#lb .lb-x:hover{border-color:var(--gold);color:var(--gold)}
#lb .lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:54px;height:54px;border:1px solid var(--gold-soft);border-radius:50%;background:rgba(10,10,10,.3);color:var(--cream);font-size:1.3rem;cursor:pointer;transition:all .3s}
#lb .lb-nav:hover{border-color:var(--gold);color:var(--gold);background:rgba(10,10,10,.6)}
#lb .lb-prev{left:clamp(.8rem,2vw,2rem)} #lb .lb-next{right:clamp(.8rem,2vw,2rem)}

/* ===== FOOTER CTA ===== */
.gfoot{text-align:center;padding:clamp(3rem,8vh,6rem) 1.5rem clamp(4rem,10vh,7rem)}
.gfoot .line{height:1px;width:60px;background:var(--gold-soft);margin:0 auto 2rem}
.gfoot p{font-family:var(--font-display);font-style:italic;font-size:clamp(1.4rem,2.6vw,2rem);color:var(--cream);margin-bottom:2rem}
.gfoot a.cta{display:inline-block;font-family:var(--font-label);font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-hi);
  border:1px solid var(--gold-soft);padding:1rem 2.4rem;border-radius:1px;transition:all .4s ease}
.gfoot a.cta:hover{background:var(--gold);color:var(--ink);border-color:var(--gold)}

@media (max-width:600px){
  .gcell,.gcell.portrait{flex-basis:100%;max-width:100%}
  .gchips{top:54px}
  .gbar{padding:.85rem 1.1rem}
  .gbar .est{display:none}
  .gbar .home,.gbar .count{font-size:.6rem;letter-spacing:.18em}
  .group{padding-left:1rem;padding-right:1rem}
  .group-title{flex-wrap:wrap;gap:.6rem}
  .group-title .gt-name{font-size:.72rem;letter-spacing:.18em;white-space:normal;line-height:1.4;flex:1 1 auto}
  .group-title .gt-rule{display:none}
  .ghead h1{font-size:1.9rem}
  .gchips{gap:.4rem}
  .chip{font-size:.6rem;letter-spacing:.14em;padding:.45rem .8rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

var CLOUD="https://res.cloudinary.com/dghn2xpif/image/upload/";

function tinyUrl(id){ return CLOUD+"c_limit,w_40,e_blur:200,f_auto,q_auto:low/v1/garran-hill/photos/"+id+".jpg"; }
function fullUrl(id){ return CLOUD+"c_limit,w_2400,dpr_auto,f_auto,q_auto:best/v1/garran-hill/photos/"+id+".jpg"; }

  "047-heart-pine-stairs-to-second-level":1,"109-den-spiral-staircase":1 };

// Room groups in MLS walk order. Map each category to a buyer-readable section.
var GROUPS=[
  {key:"exterior",label:"Arrival & Exterior"},

  {key:"private",label:"Bedrooms & Private Spaces"},

];
var GLABEL={exterior:"Arrival & Exterior",main:"The Main Floor",quiet:"Library, Sitting & Quiet Rooms",private:"Bedrooms & Private Spaces",grounds:"The Grounds"};

document.getElementById('topcount').textContent = photos.length + " Photographs";

GROUPS.forEach(function(g){ if(photos.some(function(p){return p[2]===g.key;})) mkChip(g.label.replace('& ','& '),'grp-'+g.key,false); });

// swipe
var tx=0; lb.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
lb.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50){dx<0?next():prev();}},{passive:true});
</script>
</body>
</html>
