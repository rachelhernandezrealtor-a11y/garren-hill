<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Private Workspace | Rachel Hernandez Studio</title>
  <style>
    :root {
      --dark: #0a0a0a;
      --gold: #C9A96E;
      --cream: #F5F0E8;
      --muted: rgba(245, 240, 232, .58);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--dark);
      color: var(--cream);
      font-family: "Cormorant Garamond", Georgia, serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 32px;
    }

    main {
      width: min(560px, 100%);
      text-align: center;
    }

    .kicker {
      color: var(--gold);
      font-size: .72rem;
      letter-spacing: .32em;
      margin-bottom: 22px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 11vw, 6rem);
      font-weight: 300;
      line-height: .95;
    }

    p {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.6vw, 1.35rem);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <div class="kicker">Rachel Studio</div>
    <h1>Private workspace.</h1>
    <p>Protected access required.</p>
  </main>
</body>
</html>
